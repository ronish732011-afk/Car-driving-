<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garage - RONISH Gaming</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #0b0b0b, #1b1b1b);
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
        }
        .garage-title {
            color: #FFD700;
            font-size: 2.2rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
        }
        .subtitle {
            color: #888;
            margin-bottom: 25px;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .car-card {
            background: #181818;
            border: 2px solid #FFD700;
            padding: 20px 35px;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.2);
            margin-bottom: 25px;
        }
        .car-card h2 {
            color: #FFD700;
            margin: 0 0 8px 0;
            font-size: 1.4rem;
        }
        .car-card p {
            color: #ccc;
            margin: 0;
            font-size: 0.9rem;
        }
        .play-btn {
            background-color: #FFD700;
            color: #000;
            border: none;
            padding: 14px 45px;
            font-size: 1.3rem;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
            transition: 0.2s;
        }
        .play-btn:active {
            transform: scale(0.95);
            background-color: #e5c100;
        }
    </style>
</head>
<body>

    <div class="garage-title">RONISH Gaming</div>
    <div class="subtitle">Showroom Garage</div>

    <div class="car-card">
        <h2>Yellow Porsche</h2>
        <p>Status: Unlocked & Ready</p>
    </div>

    <button class="play-btn" onclick="startGame()">Play</button>

    <script>
        function startGame() {
            window.location.href = "game.html";
        }
    </script>
</body>
</html>
