<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World - RONISH Gaming</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; }
        
        #orientation-warning {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #050510;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            color: #FFD700;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 20px;
        }
        #orientation-warning h1 { font-size: 1.8rem; margin-bottom: 10px; }
        #orientation-warning p { color: #aaa; font-size: 1rem; }

        @media screen and (orientation: portrait) {
            #orientation-warning { display: flex; }
        }

        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 40px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        .steering-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
            align-self: flex-end;
        }
        .pedals-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            align-items: flex-end;
        }
        
        .steer-btn {
            width: 70px;
            height: 70px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            font-size: 1.4rem;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
        }
        .steer-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.92);
        }

        .pedal-btn {
            width: 60px;
            height: 48px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.6);
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: bold;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            text-transform: uppercase;
        }
        .pedal-btn:active {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(0.95);
        }

        #hud {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .hud-box {
            color: #FFD700;
            background: rgba(0,0,0,0.7);
            padding: 6px 14px;
            border-radius: 6px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            border: 1px solid #FFD700;
            font-size: 0.9rem;
        }

        #interaction-prompt {
            position: absolute;
            bottom: 110px;
            left: 50%;
            transform: translateX(-50%);
            color: #FFD700;
            background: rgba(0,0,0,0.8);
            padding: 8px 16px;
            border-radius: 6px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            font-size: 1rem;
            border: 1px solid #FFD700;
            display: none;
            z-index: 10;
        }
        
        #audio-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 999;
            color: #FFD700;
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            cursor: pointer;
        }
        #audio-overlay h1 { margin-bottom: 10px; font-size: 2rem; }
        #audio-overlay p { color: #ccc; font-size: 1rem; }
    </style>
</head>
<body>

    <div id="orientation-warning">
        <h1>📱 Rotate Your Phone</h1>
        <p>Please hold your phone horizontally to play RONISH Gaming Open World!</p>
    </div>

    <div id="audio-overlay" onclick="initAudio()">
        <h1>RONISH Gaming - Open World</h1>
        <p>🔊 Tap anywhere to start engine audio & play!</p>
    </div>

    <div id="hud">
        <div class="hud-box" id="timeDisplay">TIME: DAY</div>
        <div class="hud-box" id="speedometer">SPEED: 0 MPH</div>
    </div>

    <div id="interaction-prompt">Press [F] to Enter Car</div>

    <div class="controls-container">
        <div class="steering-group">
            <button class="steer-btn" id="leftBtn">◀</button>
            <button class="steer-btn" id="rightBtn">▶</button>
        </div>
        <div class="pedals-group">
            <button class="pedal-btn" id="accelBtn">GAS</button>
            <button class="pedal-btn" id="brakeBtn">BRAKE</button>
            <button class="pedal-btn" id="revBtn">REV</button>
        </div>
    </div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Web Audio Synth
        let audioCtx = null;
        let engineOsc = null;
        let engineGain = null;
        let soundInitialized = false;

        function initAudio() {
            if (soundInitialized) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(55, audioCtx.currentTime);

            engineGain = audioCtx.createGain();
            engineGain.gain.setValueAtTime(0.02, audioCtx.currentTime);

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(350, audioCtx.currentTime);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();

            soundInitialized = true;
            document.getElementById('audio-overlay').style.display = 'none';
        }

        function playBrakeScreech() {
            if (!soundInitialized || !audioCtx) return;
            const bufferSize = audioCtx.sampleRate * 0.15;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;

            const filter = audioCtx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1400, audioCtx.currentTime);
            filter.Q.setValueAtTime(4, audioCtx.currentTime);

            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        // Three.js Setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x70b5ff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(40, 80, 40);
        scene.add(dirLight);

        // --- ISLAND & OCEAN ---
        const oceanMat = new THREE.MeshStandardMaterial({ color: 0x1e90ff, roughness: 0.1 });
        const ocean = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000), oceanMat);
        ocean.rotation.x = -Math.PI / 2;
        ocean.position.y = -0.5;
        scene.add(ocean);

        const islandMat = new THREE.MeshStandardMaterial({ color: 0x2e8b57, roughness: 0.9 });
        const island = new THREE.Mesh(new THREE.PlaneGeometry(300, 300), islandMat);
        island.rotation.x = -Math.PI / 2;
        island.position.y = 0;
        scene.add(island);

        // --- ROADS ---
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.9 });
        const mainRoadX = new THREE.Mesh(new THREE.PlaneGeometry(300, 24), roadMat);
        mainRoadX.rotation.x = -Math.PI / 2;
        mainRoadX.position.y = 0.01;
        scene.add(mainRoadX);

        const mainRoadZ = new THREE.Mesh(new THREE.PlaneGeometry(24, 300), roadMat);
        mainRoadZ.rotation.x = -Math.PI / 2;
        mainRoadZ.position.y = 0.02;
        scene.add(mainRoadZ);

        // --- PLAYER HOME (Center of Island) ---
        const houseGroup = new THREE.Group();
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xcccccc, roughness: 0.7 });
        const houseWalls = new THREE.Mesh(new THREE.BoxGeometry(10, 6, 10), wallMat);
        houseWalls.position.y = 3;
        houseGroup.add(houseWalls);

        const roofMat = new THREE.MeshStandardMaterial({ color: 0xb22222, roughness: 0.5 });
        const houseRoof = new THREE.Mesh(new THREE.ConeGeometry(8, 4, 4), roofMat);
        houseRoof.position.y = 8;
        houseRoof.rotation.y = Math.PI / 4;
        houseGroup.add(houseRoof);

        // Position home right near the center crossroad
        houseGroup.position.set(-20, 0, -20);
        scene.add(houseGroup);

        // --- REALISTIC 3D WHITE & CARBON SPORTS CAR (Parked on Right Side of Road) ---
        const carGroup = new THREE.Group();
        const whiteCarMat = new THREE.MeshStandardMaterial({ color: 0xf0f0f0, metalness: 0.3, roughness: 0.2 });
        const carbonMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.4 });
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });

        const lowerBody = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.45, 4.4), whiteCarMat);
        lowerBody.position.y = 0.4;
        carGroup.add(lowerBody);

        const hood = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.25, 1.5), carbonMat);
        hood.position.set(0, 0.55, 1.3);
        hood.rotation.x = -0.15;
        carGroup.add(hood);

        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 2.1), glassMat);
        cabin.position.set(0, 0.85, -0.2);
        carGroup.add(cabin);

        const spoilerWing = new THREE.Mesh(new THREE.BoxGeometry(1.9, 0.08, 0.5), carbonMat);
        spoilerWing.position.set(0, 1.05, -1.9);
        carGroup.add(spoilerWing);

        const lightGeo = new THREE.BoxGeometry(0.35, 0.15, 0.1);
        const headLightMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
        
        const leftHead = new THREE.Mesh(lightGeo, headLightMat);
        leftHead.position.set(-0.75, 0.45, 2.22);
        carGroup.add(leftHead);
        const rightHead = new THREE.Mesh(lightGeo, headLightMat);
        rightHead.position.set(0.75, 0.45, 2.22);
        carGroup.add(rightHead);

        const carSpotLight = new THREE.SpotLight(0xffffff, 0, 50, Math.PI / 4, 0.5, 2);
        carSpotLight.position.set(0, 0.8, 2.2);
        carSpotLight.target.position.set(0, 0, 10);
        carGroup.add(carSpotLight);
        carGroup.add(carSpotLight.target);

        const brakeLightMat = new THREE.MeshBasicMaterial({ color: 0x330000 });
        const leftBrake = new THREE.Mesh(lightGeo, brakeLightMat);
        leftBrake.position.set(-0.75, 0.45, -2.22);
        carGroup.add(leftBrake);
        const rightBrake = new THREE.Mesh(lightGeo, brakeLightMat);
        rightBrake.position.set(0.75, 0.45, -2.22);
        carGroup.add(rightBrake);

        const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.3, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1b, roughness: 0.9 });
        [[ -1.1, 0.4, 1.4 ], [ 1.1, 0.4, 1.4 ], [ -1.1, 0.4, -1.4 ], [ 1.1, 0.4, -1.4 ]].forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...pos);
            carGroup.add(w);
        });

        // Parked on the right side of the horizontal road near home
        carGroup.position.set(16, 0, 5);
        carGroup.rotation.y = Math.PI / 2;
        scene.add(carGroup);

        // --- PLAYER CHARACTER (Spawn outside home) ---
        const playerGroup = new THREE.Group();
        const playerMat = new THREE.MeshStandardMaterial({ color: 0xe53e3e });
        const playerBody = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.6, 0.6), playerMat);
        playerBody.position.y = 0.8;
        playerGroup.add(playerBody);

        // Spawn player right near home
        playerGroup.position.set(-5, 0, 5);
        scene.add(playerGroup);

        // Game State
        let inCar = false;
        let speed = 0;
        let steering = 0;
        let playerSpeed = 0.15;
        const keys = {};

        window.addEventListener('keydown', (e) => {
            const key = e.key.toLowerCase();
            keys[key] = true;
            if (key === 'f') {
                toggleCarEntry();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function toggleCarEntry() {
            let dist = playerGroup.position.distanceTo(carGroup.position);
            if (!inCar && dist < 6) {
                inCar = true;
                playerGroup.visible = false;
                document.getElementById('interaction-prompt').innerText = "Press [F] to Exit Car";
            } else if (inCar) {
                inCar = false;
                playerGroup.visible = true;
                // Step out to the side of the car
                playerGroup.position.set(carGroup.position.x - 3, 0, carGroup.position.z);
                document.getElementById('interaction-prompt').style.display = 'none';
            }
        }

        function bindTouch(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => keys[keyName] = true);
            btn.addEventListener('mouseup', () => keys[keyName] = false);
        }

        bindTouch('leftBtn', 'a');
        bindTouch('rightBtn', 'd');
        bindTouch('accelBtn', 'w');
        bindTouch('brakeBtn', 's');
        bindTouch('revBtn', 'r');

        let gameTimeSeconds = 0;

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Day/Night Cycle
            gameTimeSeconds += 0.016;
            const cycleProgress = (gameTimeSeconds % 600) / 600;
            const isNight = cycleProgress >= 0.5;
            
            document.getElementById('timeDisplay').innerText = isNight ? "TIME: NIGHT" : "TIME: DAY";

            if (isNight) {
                scene.background.setHex(0x050510);
                dirLight.color.setHex(0x4466aa);
                dirLight.intensity = 0.2;
                ambientLight.intensity = 0.2;
                headLightMat.color.setHex(0xffffff);
                carSpotLight.intensity = 3.0;
            } else {
                scene.background.setHex(0x70b5ff);
                dirLight.color.setHex(0xffffff);
                dirLight.intensity = 1.2;
                ambientLight.intensity = 0.8;
                headLightMat.color.setHex(0x333333);
                carSpotLight.intensity = 0;
            }

            if (!inCar) {
                // --- PLAYER WALKING CONTROLS ---
                let pDx = 0, pDz = 0;
                if (keys['w'] || keys['arrowup']) pDz -= 1;
                if (keys['s'] || keys['arrowdown']) pDz += 1;
                if (keys['a'] || keys['arrowleft']) pDx -= 1;
                if (keys['d'] || keys['arrowright']) pDx += 1;

                if (pDx !== 0 || pDz !== 0) {
                    playerGroup.position.x += pDx * playerSpeed;
                    playerGroup.position.z += pDz * playerSpeed;
                    playerGroup.rotation.y = Math.atan2(pDx, pDz);
                }

                // Check distance to car to show interaction prompt
                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                const prompt = document.getElementById('interaction-prompt');
                if (distToCar < 6) {
                    prompt.style.display = 'block';
                    prompt.innerText = "Press [F] to Enter Car";
                } else {
                    prompt.style.display = 'none';
                }

                // Camera follow player
                camera.position.set(playerGroup.position.x, playerGroup.position.y + 5, playerGroup.position.z - 8);
                camera.lookAt(playerGroup.position);

                document.getElementById('speedometer').innerText = "SPEED: WALKING";

            } else {
                // --- CAR DRIVING CONTROLS ---
                let isBraking = false;

                if (keys['w'] || keys['arrowup']) {
                    speed = Math.min(speed + 0.025, 0.95);
                } else if (keys['s'] || keys['arrowdown']) {
                    if (speed > 0.02) {
                        speed = Math.max(speed - 0.04, 0);
                        isBraking = true;
                        playBrakeScreech();
                    } else {
                        speed = Math.max(speed - 0.02, -0.3);
                    }
                } else if (keys['r']) {
                    speed = Math.max(speed - 0.02, -0.4);
                } else {
                    speed *= 0.95;
                }

                if (soundInitialized && engineOsc && audioCtx) {
                    const targetFreq = 55 + Math.abs(speed) * 280;
                    engineOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.1);
                    engineGain.gain.setTargetAtTime(0.015 + Math.abs(speed) * 0.055, audioCtx.currentTime, 0.1);
                }

                if (isBraking) {
                    brakeLightMat.color.setHex(0xff0000);
                } else {
                    brakeLightMat.color.setHex(0x330000);
                }

                if (keys['a'] || keys['arrowleft']) steering = 0.045;
                else if (keys['d'] || keys['arrowright']) steering = -0.045;
                else steering = 0;

                carGroup.rotation.y += steering * (speed * 1.5);
                carGroup.translateZ(speed);

                document.getElementById('speedometer').innerText = `SPEED: ${Math.round(Math.abs(speed) * 120)} MPH`;

                // Smooth Camera Follow Car
                const offset = new THREE.Vector3(0, 3.3, -7.5).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
                camera.position.copy(carGroup.position).add(offset);
                camera.lookAt(carGroup.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
