<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>City Driving - RONISH Gaming</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; }
        
        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        .steering-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            align-self: flex-end;
        }
        .pedals-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
            align-items: flex-end;
        }
        
        .steer-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
            color: #FFD700;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        .steer-btn:active {
            background: rgba(255, 215, 0, 0.6);
            transform: scale(0.92);
        }

        .pedal-btn {
            width: 65px;
            height: 50px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
            color: #FFD700;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
        }
        .pedal-btn:active {
            background: rgba(255, 215, 0, 0.6);
            transform: scale(0.95);
        }

        #speedometer {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #FFD700;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 6px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            border: 1px solid #FFD700;
            font-size: 1rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="speedometer">SPEED: 0 MPH</div>

    <div class="controls-container">
        <div class="steering-group">
            <button class="steer-btn" id="leftBtn">◀</button>
            <button class="steer-btn" id="rightBtn">▶</button>
        </div>
        <div class="pedals-group">
            <button class="pedal-btn" id="accelBtn">GAS</button>
            <button class="pedal-btn" id="brakeBtn">BRAKE</button>
        </div>
    </div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- CITY ROAD MAP ---
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.9 });
        const mainRoadX = new THREE.Mesh(new THREE.PlaneGeometry(300, 30), roadMat);
        mainRoadX.rotation.x = -Math.PI / 2;
        mainRoadX.position.y = 0.01;
        scene.add(mainRoadX);

        const mainRoadZ = new THREE.Mesh(new THREE.PlaneGeometry(30, 300), roadMat);
        mainRoadZ.rotation.x = -Math.PI / 2;
        mainRoadZ.position.y = 0.02;
        scene.add(mainRoadZ);

        // White Road Stripes
        const whiteLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = -140; i < 140; i += 12) {
            const dashX = new THREE.Mesh(new THREE.BoxGeometry(4, 0.04, 0.3), whiteLineMat);
            dashX.position.set(i, 0.03, 0);
            scene.add(dashX);

            const dashZ = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 4), whiteLineMat);
            dashZ.position.set(0, 0.03, i);
            scene.add(dashZ);
        }

        // Buildings
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x222629 });
        const buildingPositions = [
            [-50, -50], [-50, 50], [50, -50], [50, 50],
            [-100, -50], [-100, 50], [100, -50], [100, 50]
        ];
        buildingPositions.forEach(([x, z]) => {
            const h = 30;
            const b = new THREE.Mesh(new THREE.BoxGeometry(25, h, 25), buildingMat);
            b.position.set(x, h/2, z);
            scene.add(b);
        });


        // --- GUARANTEED VISIBLE YELLOW PORSCHE ---
        const carGroup = new THREE.Group();

        // 1. Car Body (Bright Yellow, large dimensions so it's impossible to miss)
        const bodyGeo = new THREE.BoxGeometry(2.2, 0.8, 4.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.2 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.6; // Clearly above road
        carGroup.add(carBody);

        // 2. Cabin Roof
        const cabinGeo = new THREE.BoxGeometry(1.6, 0.7, 2.2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.3, -0.2);
        carGroup.add(cabin);

        // 3. Headlights (Front)
        const headLightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
        const headLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        
        const leftHead = new THREE.Mesh(headLightGeo, headLightMat);
        leftHead.position.set(-0.7, 0.6, 2.3);
        carGroup.add(leftHead);

        const rightHead = new THREE.Mesh(headLightGeo, headLightMat);
        rightHead.position.set(0.7, 0.6, 2.3);
        carGroup.add(rightHead);

        // 4. Brake Lights (Back - dynamic glow)
        const brakeLightMat = new THREE.MeshBasicMaterial({ color: 0x330000 });
        const leftBrake = new THREE.Mesh(headLightGeo, brakeLightMat);
        leftBrake.position.set(-0.7, 0.6, -2.3);
        carGroup.add(leftBrake);

        const rightBrake = new THREE.Mesh(headLightGeo, brakeLightMat);
        rightBrake.position.set(0.7, 0.6, -2.3);
        carGroup.add(rightBrake);

        // 5. Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.35, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const wheelCoords = [
            [-1.2, 0.5, 1.5], [1.2, 0.5, 1.5],
            [-1.2, 0.5, -1.5], [1.2, 0.5, -1.5]
        ];
        wheelCoords.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...pos);
            carGroup.add(w);
        });

        scene.add(carGroup);

        // Camera setup positioned directly behind the car
        camera.position.set(0, 4, -9);
        camera.lookAt(carGroup.position);

        // Controls
        let speed = 0;
        let steering = 0;
        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function bindTouch(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => keys[keyName] = true);
            btn.addEventListener('mouseup', () => keys[keyName] = false);
        }

        bindTouch('leftBtn', 'a');
        bindTouch('rightBtn', 'd');
        bindTouch('accelBtn', 'w');
        bindTouch('brakeBtn', 's');

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            let isBraking = false;

            if (keys['w'] || keys['arrowup']) {
                speed = Math.min(speed + 0.025, 0.9);
            } else if (keys['s'] || keys['arrowdown']) {
                if (speed > 0.02) {
                    speed = Math.max(speed - 0.04, 0);
                    isBraking = true; // Trigger brake lights
                } else {
                    speed = Math.max(speed - 0.02, -0.3);
                }
            } else {
                speed *= 0.95;
            }

            // Glow brake lights red when braking
            if (isBraking) {
                brakeLightMat.color.setHex(0xff0000);
            } else {
                brakeLightMat.color.setHex(0x330000);
            }

            if (keys['a'] || keys['arrowleft']) steering = 0.045;
            else if (keys['d'] || keys['arrowright']) steering = -0.045;
            else steering = 0;

            carGroup.rotation.y += steering * (speed * 1.5);
            carGroup.translateZ(speed);

            // Update Speedometer UI
            document.getElementById('speedometer').innerText = `SPEED: ${Math.round(Math.abs(speed) * 120)} MPH`;

            // Lock camera smoothly behind moving car
            const offset = new THREE.Vector3(0, 3.5, -8).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
            camera.position.copy(carGroup.position).add(offset);
            camera.lookAt(carGroup.position);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
