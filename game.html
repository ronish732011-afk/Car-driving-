<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World 3D - Pro Flight Simulation Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87ceeb; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* GTA Style Mini-Map & HUD */
        #minimap {
            position: absolute; top: 15px; left: 15px;
            width: 140px; height: 100px;
            background: rgba(20, 35, 50, 0.85);
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        #minimap::before {
            content: ''; position: absolute; top: 50%; left: 0; width: 100%; height: 2px; background: rgba(255,255,255,0.2);
        }
        #minimap::after {
            content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 100%; background: rgba(255,255,255,0.2);
        }
        #map-blip {
            position: absolute; top: 48px; left: 66px; width: 8px; height: 8px; background: #3498db; border: 1px solid #fff; border-radius: 50%;
        }

        #hud-stats {
            position: absolute; top: 15px; right: 15px;
            text-align: right; color: white; font-weight: bold; font-size: 13px;
            text-shadow: 1px 1px 2px #000;
        }
        .bar-container { width: 120px; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; margin-top: 4px; display: inline-block; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); }
        .health-fill { width: 100%; height: 100%; background: #2ecc71; }
        .armor-fill { width: 85%; height: 100%; background: #3498db; }

        /* Joystick styling (Left) */
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Flight Throttle & Pitch UI Controls (Visible only when in Airplane) */
        #flight-controls {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            display: none; pointer-events: auto; text-align: center; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 12px; color: white;
        }
        .flight-btn {
            background: #e74c3c; color: white; border: none; padding: 12px 18px; margin: 0 5px; font-weight: bold; border-radius: 8px; font-size: 14px;
        }

        /* Action Button (Right) */
        #action-btn {
            position: absolute; bottom: 50px; right: 40px;
            padding: 18px 28px; font-size: 18px; font-weight: bold;
            background: #ffcc00; color: #000; border: none; border-radius: 12px;
            display: none; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="minimap"><div id="map-blip"></div></div>
        <div id="hud-stats">
            <div>HEALTH <div class="bar-container"><div class="health-fill"></div></div></div>
            <div>ARMOR <div class="bar-container"><div class="armor-fill"></div></div></div>
            <div style="margin-top: 10px; font-size: 16px; color: #ffcc00;">$8,450,210</div>
            <div style="margin-top: 6px; font-size: 13px; color: #bdc3c7;">Downtown City</div>
            <div style="margin-top: 8px; font-size: 14px;">AMMO 45/180</div>
        </div>

        <!-- Airplane Dedicated UI Controls -->
        <div id="flight-controls">
            <div style="margin-bottom: 6px; font-size: 12px; color: #f1c40f;">FLIGHT CONTROLS</div>
            <button class="flight-btn" id="throttle-up">THROTTLE +</button>
            <button class="flight-btn" id="throttle-down">THROTTLE -</button>
            <button class="flight-btn" id="pitch-up" style="background:#27ae60;">PITCH UP (▲)</button>
            <button class="flight-btn" id="pitch-down" style="background:#2980b9;">PITCH DOWN (▼)</button>
        </div>

        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <button id="action-btn">Enter</button>
    </div>

    <!-- Three.js Library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.85);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 150, 100);
        scene.add(dirLight);

        // --- 2. ENVIRONMENT & ISLAND ---
        const sea = new THREE.Mesh(new THREE.PlaneGeometry(2500, 2500), new THREE.MeshBasicMaterial({ color: 0x1e90ff }));
        sea.rotation.x = -Math.PI / 2; sea.position.y = -0.6; scene.add(sea);

        const islandMat = new THREE.MeshLambertMaterial({ color: 0x4e6e3d }); 
        const mainIsland = new THREE.Mesh(new THREE.CylinderGeometry(250, 270, 1, 32), islandMat);
        mainIsland.position.y = -0.5; scene.add(mainIsland);

        // Burj Khalifa in City Center
        const burjGroup = new THREE.Group();
        const bBase = new THREE.Mesh(new THREE.BoxGeometry(12, 120, 12), new THREE.MeshLambertMaterial({ color: 0xbdc3c7 }));
        bBase.position.y = 60; burjGroup.add(bBase);
        const bMid = new THREE.Mesh(new THREE.BoxGeometry(8, 60, 8), new THREE.MeshLambertMaterial({ color: 0x95a5a6 }));
        bMid.position.y = 150; burjGroup.add(bMid);
        const bTop = new THREE.Mesh(new THREE.BoxGeometry(4, 50, 4), new THREE.MeshLambertMaterial({ color: 0xecf0f1 }));
        bTop.position.y = 200; burjGroup.add(bTop);
        burjGroup.position.set(0, 0, 0);
        scene.add(burjGroup);

        // LSIA Airport Runway
        const airportGroup = new THREE.Group();
        const tarmac = new THREE.Mesh(new THREE.BoxGeometry(120, 0.05, 300), new THREE.MeshLambertMaterial({ color: 0x222222 }));
        tarmac.position.set(180, -0.45, 0);
        airportGroup.add(tarmac);

        const runway = new THREE.Mesh(new THREE.BoxGeometry(30, 0.09, 260), new THREE.MeshBasicMaterial({ color: 0x111111 }));
        runway.position.set(180, -0.43, 0);
        airportGroup.add(runway);
        scene.add(airportGroup);

        // Roads
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a }); 
        const highwayH = new THREE.Mesh(new THREE.BoxGeometry(500, 0.08, 22), roadMat); 
        highwayH.position.set(0, -0.42, 0); scene.add(highwayH);
        const highwayV = new THREE.Mesh(new THREE.BoxGeometry(22, 0.08, 500), roadMat); 
        highwayV.position.set(0, -0.41, 0); scene.add(highwayV);

        // Buildings & Collisions
        const solidObjects = [];
        function createBuilding(x, z, w, h, d) {
            const bMat = new THREE.MeshLambertMaterial({ color: 0x7f8c8d });
            const building = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), bMat);
            building.position.set(x, h / 2 - 0.5, z);
            scene.add(building);
            solidObjects.push({ x, z, w: w + 1, d: d + 1 });
        }
        for (let x = -180; x <= 120; x += 35) {
            if (Math.abs(x) < 25) continue;
            createBuilding(x, -50, 16, 35 + Math.random() * 20, 16);
            createBuilding(x, 50, 16, 30 + Math.random() * 25, 16);
        }

        // Random NPCs
        const npcPeople = [];
        function createRandomNPC(x, z) {
            const npcGroup = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.8, 0.3), new THREE.MeshLambertMaterial({ color: Math.random() * 0xffffff }));
            torso.position.y = 0.9; npcGroup.add(torso);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
            head.position.y = 1.4; npcGroup.add(head);
            npcGroup.position.set(x, 0, z);
            scene.add(npcGroup);
            solidObjects.push({ x, z, w: 0.8, d: 0.8, isDynamic: true, mesh: npcGroup });
            npcPeople.push({ group: npcGroup, xMin: x - 15, xMax: x + 15, zMin: z - 15, zMax: z + 15, speedX: (Math.random() - 0.5) * 0.06, speedZ: (Math.random() - 0.5) * 0.06 });
        }
        for(let i = -100; i <= 100; i += 25) {
            createRandomNPC(15, i);
            createRandomNPC(-15, i + 10);
        }

        // Player & Vehicles
        const playerGroup = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0x2c3e50 }));
        torso.position.y = 1.1; playerGroup.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
        head.position.y = 1.8; playerGroup.add(head);
        
        const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.3);
        const armMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
        const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-0.55, 1.1, 0); playerGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(0.55, 1.1, 0); playerGroup.add(rightArm);
        
        const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
        const legMat = new THREE.MeshLambertMaterial({ color: 0x1a252f });
        const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.2, 0.45, 0); playerGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.2, 0.45, 0); playerGroup.add(rightLeg);

        playerGroup.position.set(-20, 0, -20);
        scene.add(playerGroup);

        const carGroup = new THREE.Group();
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.2), new THREE.MeshLambertMaterial({ color: 0xd35400 }));
        carBody.position.y = 0.6; carGroup.add(carBody);
        carGroup.position.set(20, 0, 15); scene.add(carGroup);

        const boatGroup = new THREE.Group();
        const boatHull = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 5.0), new THREE.MeshLambertMaterial({ color: 0x2980b9 }));
        boatHull.position.y = 0.3; boatGroup.add(boatHull);
        boatGroup.position.set(280, -0.2, 0); scene.add(boatGroup);

        const planeGroup = new THREE.Group();
        const fuselage = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 14), new THREE.MeshLambertMaterial({ color: 0xecf0f1 }));
        fuselage.position.y = 1.5; planeGroup.add(fuselage);
        const wings = new THREE.Mesh(new THREE.BoxGeometry(18, 0.3, 4), new THREE.MeshLambertMaterial({ color: 0xbdc3c7 }));
        wings.position.set(0, 1.5, 0); planeGroup.add(wings);
        planeGroup.position.set(180, 0, -50); scene.add(planeGroup);

        // --- 4. PRO FLIGHT CONTROLLER LOGIC ---
        let vehicleState = 'none'; 
        let moveX = 0, moveY = 0; 
        let playerSpeed = 0.18;
        let vehicleSpeed = 0;
        let vehicleRotation = 0;
        
        // Advanced Airplane Physics Variables
        let planeThrottle = 0;   // Engine power
        let planeSpeed = 0;
        let planeAltitude = 0;
        let planePitch = 0;      // Up and Down tilt
        let walkCycle = 0;

        // Button handlers for Airplane Throttle & Pitch
        let throttleVal = 0;
        let pitchVal = 0;

        document.getElementById('throttle-up').addEventListener('touchstart', () => { throttleVal = 0.5; });
        document.getElementById('throttle-up').addEventListener('touchend', () => { throttleVal = 0; });
        document.getElementById('throttle-down').addEventListener('touchstart', () => { throttleVal = -0.5; });
        document.getElementById('throttle-down').addEventListener('touchend', () => { throttleVal = 0; });

        document.getElementById('pitch-up').addEventListener('touchstart', () => { pitchVal = 1; });
        document.getElementById('pitch-up').addEventListener('touchend', () => { pitchVal = 0; });
        document.getElementById('pitch-down').addEventListener('touchstart', () => { pitchVal = -1; });
        document.getElementById('pitch-down').addEventListener('touchend', () => { pitchVal = 0; });

        let cameraAngleY = 0;
        let cameraAngleX = 0.5;
        let isDragging = false;
        let prevTouchX = 0, prevTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX > window.innerWidth / 2 && vehicleState === 'none') {
                isDragging = true;
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                let dx = e.touches[0].clientX - prevTouchX;
                let dy = e.touches[0].clientY - prevTouchY;
                cameraAngleY -= dx * 0.005;
                cameraAngleX = Math.max(0.1, Math.min(1.2, cameraAngleX + dy * 0.005));
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // Joystick
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        let touchingJoystick = false;

        base.addEventListener('touchstart', (e) => { touchingJoystick = true; handleJoystick(e); });
        window.addEventListener('touchmove', (e) => { if (touchingJoystick) handleJoystick(e); });
        window.addEventListener('touchend', () => {
            touchingJoystick = false;
            moveX = 0; moveY = 0;
            stick.style.transform = `translate(0px, 0px)`;
        });

        function handleJoystick(e) {
            let baseRect = base.getBoundingClientRect();
            for (let i = 0; i < e.touches.length; i++) {
                let touch = e.touches[i];
                if (touch.clientX < window.innerWidth / 2) {
                    let centerX = baseRect.left + baseRect.width / 2;
                    let centerY = baseRect.top + baseRect.height / 2;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 40;

                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist;
                    moveY = -dy / maxDist;
                    return;
                }
            }
        }

        // Action Button
        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('click', () => {
            if (vehicleState === 'none') {
                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);
                let distToPlane = playerGroup.position.distanceTo(planeGroup.position);

                if (distToCar < 4.5) {
                    vehicleState = 'car'; playerGroup.visible = false; actionBtn.innerText = "Exit Car";
                } else if (distToBoat < 6.0) {
                    vehicleState = 'boat'; playerGroup.visible = false; actionBtn.innerText = "Exit Boat";
                } else if (distToPlane < 8.0) {
                    vehicleState = 'plane'; playerGroup.visible = false; actionBtn.innerText = "Exit Plane";
                    document.getElementById('flight-controls').style.display = 'block';
                }
            } else if (vehicleState === 'car') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(carGroup.position.x - 2.5, 0, carGroup.position.z);
                actionBtn.innerText = "Enter";
            } else if (vehicleState === 'boat') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(boatGroup.position.x - 3, 0, boatGroup.position.z);
                actionBtn.innerText = "Enter";
            } else if (vehicleState === 'plane') {
                if (planeAltitude < 3) {
                    vehicleState = 'none'; playerGroup.visible = true;
                    playerGroup.position.set(planeGroup.position.x - 4, 0, planeGroup.position.z);
                    document.getElementById('flight-controls').style.display = 'none';
                    actionBtn.innerText = "Enter";
                } else {
                    alert("Land the plane to ground (Altitude 0) before exiting!");
                }
            }
        });

        function checkCollision(nx, nz, radius = 0.8) {
            for (let obj of solidObjects) {
                if (Math.abs(nx - obj.x) < (obj.w / 2 + radius) && Math.abs(nz - obj.z) < (obj.d / 2 + radius)) {
                    return true;
                }
            }
            return false;
        }

        // --- 5. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            npcPeople.forEach(p => {
                p.group.position.x += p.speedX;
                p.group.position.z += p.speedZ;
                if (p.group.position.x > p.xMax || p.group.position.x < p.xMin) p.speedX *= -1;
                if (p.group.position.z > p.zMax || p.group.position.z < p.zMin) p.speedZ *= -1;

                let obj = solidObjects.find(o => o.mesh === p.group);
                if (obj) { obj.x = p.group.position.x; obj.z = p.group.position.z; }
            });

            if (vehicleState === 'none') {
                if (moveX !== 0 || moveY !== 0) {
                    let moveAngle = Math.atan2(moveX, moveY) + cameraAngleY;
                    let nx = playerGroup.position.x + Math.sin(moveAngle) * playerSpeed;
                    let nz = playerGroup.position.z + Math.cos(moveAngle) * playerSpeed;

                    if (!checkCollision(nx, nz, 0.5)) {
                        playerGroup.position.x = nx;
                        playerGroup.position.z = nz;
                    }
                    playerGroup.rotation.y = moveAngle;

                    walkCycle += 0.2;
                    leftArm.rotation.x = Math.sin(walkCycle) * 0.5; rightArm.rotation.x = -Math.sin(walkCycle) * 0.5;
                    leftLeg.rotation.x = -Math.sin(walkCycle) * 0.5; rightLeg.rotation.x = Math.sin(walkCycle) * 0.5;
                } else {
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0; leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                }

                const blip = document.getElementById('map-blip');
                blip.style.transform = `translate(${playerGroup.position.x * 0.25}px, ${playerGroup.position.z * 0.25}px)`;

                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);
                let distToPlane = playerGroup.position.distanceTo(planeGroup.position);

                if (distToCar < 4.5) { actionBtn.innerText = "Enter Car"; actionBtn.style.display = "block"; }
                else if (distToBoat < 6.0) { actionBtn.innerText = "Enter Boat"; actionBtn.style.display = "block"; }
                else if (distToPlane < 8.0) { actionBtn.innerText = "Enter Plane"; actionBtn.style.display = "block"; }
                else { actionBtn.style.display = "none"; }

                let camX = playerGroup.position.x + Math.sin(cameraAngleY) * 12 * Math.cos(cameraAngleX);
                let camY = playerGroup.position.y + 3 + Math.sin(cameraAngleX) * 10;
                let camZ = playerGroup.position.z + Math.cos(cameraAngleY) * 12 * Math.cos(cameraAngleX);
                camera.position.set(camX, camY, camZ);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            } else if (vehicleState === 'car') {
                let targetSpeed = moveY * 0.45;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.1;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.05 * Math.sign(vehicleSpeed);
                    carGroup.rotation.y = vehicleRotation;
                }

                let nx = carGroup.position.x + Math.sin(vehicleRotation) * vehicleSpeed;
                let nz = carGroup.position.z + Math.cos(vehicleRotation) * vehicleSpeed;
                if (!checkCollision(nx, nz, 1.2)) {
                    carGroup.position.x = nx; carGroup.position.z = nz;
                }

                camera.position.set(carGroup.position.x - Math.sin(vehicleRotation) * 14, carGroup.position.y + 5, carGroup.position.z - Math.cos(vehicleRotation) * 14);
                camera.lookAt(carGroup.position);

            } else if (vehicleState === 'boat') {
                let targetSpeed = moveY * 0.35;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.08;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.04 * Math.sign(vehicleSpeed);
                    boatGroup.rotation.y = vehicleRotation;
                }

                boatGroup.position.x += Math.sin(vehicleRotation) * vehicleSpeed;
                boatGroup.position.z += Math.cos(vehicleRotation) * vehicleSpeed;

                camera.position.set(boatGroup.position.x - Math.sin(vehicleRotation) * 16, boatGroup.position.y + 6, boatGroup.position.z - Math.cos(vehicleRotation) * 16);
                camera.lookAt(boatGroup.position);

            } else if (vehicleState === 'plane') {
                // --- PRO AIRPLANE THROTTLE & PITCH FLIGHT PHYSICS ---
                planeThrottle = Math.max(0, Math.min(1, planeThrottle + throttleVal * 0.02));
                planeSpeed = planeThrottle * 0.8; // Speed based on throttle gear

                // Steering (Left / Right)
                if (moveX !== 0) {
                    vehicleRotation -= moveX * 0.04;
                    planeGroup.rotation.y = vehicleRotation;
                }

                // Pitch (Up / Down control via buttons)
                if (pitchVal !== 0 && planeSpeed > 0.3) {
                    planeAltitude += pitchVal * 0.4;
                    planeAltitude = Math.max(0, Math.min(300, planeAltitude));
                }

                planeGroup.position.y = planeAltitude;
                planeGroup.position.x += Math.sin(vehicleRotation) * planeSpeed;
                planeGroup.position.z += Math.cos(vehicleRotation) * planeSpeed;

                // Flight Camera Chase
                camera.position.set(
                    planeGroup.position.x - Math.sin(vehicleRotation) * 26, 
                    planeGroup.position.y + 9, 
                    planeGroup.position.z - Math.cos(vehicleRotation) * 26
                );
                camera.lookAt(planeGroup.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
