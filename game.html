    <style>
        body { margin: 0; overflow: hidden; background: #33cc33; font-family: sans-serif; touch-action: none; }
        canvas { display: block; }
        
        /* Joystick / D-Pad Area */
        #joystick-container { position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px; background: rgba(255,255,255,0.2); border: 2px solid rgba(255,255,255,0.5); border-radius: 50%; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); align-items: center; justify-items: center; }
        .j-btn { width: 38px; height: 38px; background: rgba(0,0,0,0.6); color: white; font-size: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; user-select: none; border: 1px solid rgba(255,255,255,0.5); }
        #j-up { grid-column: 2; grid-row: 1; }
        #j-left { grid-column: 1; grid-row: 2; }
        #j-right { grid-column: 3; grid-row: 2; }
        #j-down { grid-column: 2; grid-row: 3; }
