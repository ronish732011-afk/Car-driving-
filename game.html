<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RONISH Gaming - Open World</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui-layer { position: absolute; bottom: 20px; left: 20px; right: 20px; display: flex; justify-content: space-between; z-index: 10; pointer-events: none; }
        .controls-group { display: flex; gap: 10px; pointer-events: auto; }
        .btn { width: 65px; height: 65px; background: rgba(0, 0, 0, 0.6); border: 2px solid white; color: white; font-size: 20px; font-weight: bold; border-radius: 50%; display: flex; align-items: center; justify-content: center; user-select: none; }
        #action-btn { background: rgba(200, 50, 50, 0.85); border-radius: 12px; width: 100px; font-size: 13px; text-align: center; }
        #info { position: absolute; top: 10px; left: 10px; color: white; font-size: 14px; background: rgba(0,0,0,0.5); padding: 8px 12px; border-radius: 6px; }
    </style>
</head>
<body>
    <div id="info">Open World Game | Walk & Drive</div>
    <div id="ui-layer">
        <div class="controls-group">
            <div class="btn" id="btn-left">◀</div>
            <div class="btn" id="btn-up">▲</div>
            <div class="btn" id="btn-down">▼</div>
            <div class="btn" id="btn-right">▶</div>
        </div>
        <div class="controls-group">
            <div class="btn" id="action-btn">GET IN / OUT</div>
        </div>
    </div>

    <!-- Include Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let player, car, trafficCars = [];
        let isDriving = false;
        let moveInput = { x: 0, z: 0 };

        init();
        animate();

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky blue

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);

            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);

            // --- WORLD GENERATION ---
            createBox(0, -1, 0, 300, 1, 300, 0x0066cc); // Ocean
            createBox(0, 0, 0, 60, 0.5, 60, 0x33cc33);    // Island Ground
            createBox(0, 0.26, 0, 10, 0.1, 60, 0x222222);  // Asphalt Road
            createBox(-18, 0.3, 0, 6, 0.1, 60, 0xe6ccb3);  // Beach
            createBox(25, 5, 0, 15, 10, 60, 0x66523d);    // Mountain

            // Rail Tracks
            createBox(-10, 0.35, 0, 0.4, 0.2, 60, 0x444444);
            createBox(-11.5, 0.35, 0, 0.4, 0.2, 60, 0x444444);

            // --- SPAWN PLAYER ---
            const playerGeo = new THREE.CapsuleGeometry(0.4, 1, 4, 8);
            const playerMat = new THREE.MeshStandardMaterial({ color: 0x17a2b8 });
            player = new THREE.Mesh(playerGeo, playerMat);
            player.position.set(0, 1, 5);
            player.castShadow = true;
            scene.add(player);

            // --- SPAWN STYLISH CAR ---
            const carGeo = new THREE.BoxGeometry(2.2, 0.9, 4.5);
            const carMat = new THREE.MeshStandardMaterial({ color: 0xe60000, metalness: 0.5, roughness: 0.2 });
            car = new THREE.Mesh(carGeo, carMat);
            car.position.set(0, 0.8, 0);
            car.castShadow = true;
            scene.add(car);

            // --- SPAWN NPC TRAFFIC CARS ---
            spawnTraffic(3, 0.8, 15, 0x0000cc);
            spawnTraffic(-3, 0.8, -20, 0xcccc00);

            // Touch UI Listeners
            setupTouchControls();

            window.addEventListener('resize', onWindowResize);
        }

        function createBox(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        function spawnTraffic(x, y, z, color) {
            const geo = new THREE.BoxGeometry(2, 0.8, 4);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            scene.add(mesh);
            trafficCars.push(mesh);
        }

        function setupTouchControls() {
            const bind = (id, xVal, zVal) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { moveInput.x = xVal; moveInput.z = zVal; e.preventDefault(); });
                el.addEventListener('touchend', () => { moveInput.x = 0; moveInput.z = 0; });
                el.addEventListener('mousedown', () => { moveInput.x = xVal; moveInput.z = zVal; });
                el.addEventListener('mouseup', () => { moveInput.x = 0; moveInput.z = 0; });
            };

            bind('btn-up', 0, -1);
            bind('btn-down', 0, 1);
            bind('btn-left', -1, 0);
            bind('btn-right', 1, 0);

            document.getElementById('action-btn').addEventListener('click', () => {
                const dist = player.position.distanceTo(car.position);
                if (!isDriving && dist < 5) {
                    isDriving = true;
                    player.visible = false;
                } else if (isDriving) {
                    isDriving = false;
                    player.visible = true;
                    player.position.copy(car.position).add(new THREE.Vector3(2, 0, 0));
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.1;
            if (!isDriving) {
                player.position.x += moveInput.x * speed;
                player.position.z += moveInput.z * speed;

                // Camera follow player
                camera.position.set(player.position.x, player.position.y + 6, player.position.z + 8);
                camera.lookAt(player.position);
            } else {
                car.position.x += moveInput.x * (speed * 1.5);
                car.position.z += moveInput.z * (speed * 1.5);

                // Camera follow car
                camera.position.set(car.position.x, car.position.y + 7, car.position.z + 10);
                camera.lookAt(car.position);
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }
    </script>
</body>
</html>
