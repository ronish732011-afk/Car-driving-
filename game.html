<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RONISH Gaming - Open World GTA Style</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        
        /* Joystick / D-Pad Area */
        #joystick-container { position: absolute; bottom: 30px; left: 30px; width: 140px; height: 140px; background: rgba(255,255,255,0.15); border: 2px solid rgba(255,255,255,0.4); border-radius: 50%; z-index: 10; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); align-items: center; justify-items: center; }
        .j-btn { width: 40px; height: 40px; background: rgba(0,0,0,0.6); color: white; font-size: 16px; border-radius: 50%; display: flex; align-items: center; justify-content: center; user-select: none; border: 1px solid rgba(255,255,255,0.5); }
        #j-up { grid-column: 2; grid-row: 1; }
        #j-left { grid-column: 1; grid-row: 2; }
        #j-right { grid-column: 3; grid-row: 2; }
        #j-down { grid-column: 2; grid-row: 3; }

        /* Action Prompt Button (Enter / Exit Car) */
        #action-btn { position: absolute; bottom: 50px; right: 40px; width: 90px; height: 90px; background: rgba(220, 20, 60, 0.85); border: 3px solid white; color: white; font-size: 14px; font-weight: bold; border-radius: 50%; display: none; align-items: center; justify-content: center; z-index: 10; user-select: none; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; }
        
        #info { position: absolute; top: 10px; left: 10px; color: white; font-size: 14px; background: rgba(0,0,0,0.6); padding: 8px 14px; border-radius: 8px; z-index: 10; border-left: 4px solid #dc143c; }
    </style>
</head>
<body>
    <div id="info">RONISH Gaming | Walk to your Car & Press Enter</div>

    <!-- On-Screen Joystick -->
    <div id="joystick-container">
        <div class="j-btn" id="j-up">▲</div>
        <div class="j-btn" id="j-left">◀</div>
        <div class="j-btn" id="j-right">▶</div>
        <div class="j-btn" id="j-down">▼</div>
    </div>

    <!-- Dynamic Enter/Exit Button -->
    <div id="action-btn">ENTER</div>

    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer;
        let player, car;
        let isDriving = false;
        let moveInput = { x: 0, z: 0 };

        init();
        animate();

        function init() {
            // Scene & Camera
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // Sky Blue

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            document.body.appendChild(renderer.domElement);

            // Lighting
            scene.add(new THREE.AmbientLight(0xffffff, 0.6));
            const sun = new THREE.DirectionalLight(0xffffff, 0.8);
            sun.position.set(50, 100, 50);
            sun.castShadow = true;
            scene.add(sun);

            // --- ENVIRONMENT ---
            createBox(0, -1, 0, 300, 1, 300, 0x0066cc); // Ocean
            createBox(0, 0, 0, 60, 0.5, 60, 0x33cc33);    // Island Ground
            createBox(0, 0.26, 0, 10, 0.1, 60, 0x222222);  // Road
            createBox(-18, 0.3, 0, 6, 0.1, 60, 0xe6ccb3);  // Beach
            createBox(25, 5, 0, 15, 10, 60, 0x66523d);    // Mountain

            // --- PLAYER'S HOUSE ---
            // House Base
            createBox(-8, 1.5, -5, 8, 3, 6, 0xd9b38c);
            // Roof
            const roofGeo = new THREE.ConeGeometry(6, 2.5, 4);
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x990000 });
            const roof = new THREE.Mesh(roofGeo, roofMat);
            roof.position.set(-8, 4.25, -5);
            roof.rotation.y = Math.PI / 4;
            scene.add(roof);

            // --- SPAWN HUMAN PLAYER (Minecraft/Block Character style) ---
            player = new THREE.Group();
            
            // Body
            const bodyMat = new THREE.MeshStandardMaterial({ color: 0x17a2b8 });
            const bodyMesh = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.9, 0.3), bodyMat);
            bodyMesh.position.y = 0.9;
            player.add(bodyMesh);

            // Head
            const headMat = new THREE.MeshStandardMaterial({ color: 0xffdbac });
            const headMesh = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.4, 0.4), headMat);
            headMesh.position.y = 1.55;
            player.add(headMesh);

            player.position.set(-3, 0.3, -2); // Spawn right outside the house
            scene.add(player);

            // --- SPAWN STYLISH CAR ---
            car = new THREE.Group();
            
            // Car Body
            const carMat = new THREE.MeshStandardMaterial({ color: 0xe60000, metalness: 0.6, roughness: 0.2 });
            const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.5), carMat);
            carBody.position.y = 0.5;
            car.add(carBody);

            // Car Roof / Cabin
            const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
            const carCabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), cabinMat);
            carCabin.position.set(0, 1.1, -0.2);
            car.add(carCabin);

            car.position.set(2, 0.3, -2); // Parked near the house
            scene.add(car);

            // Setup Touch Controls & Interaction
            setupJoystick();

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function createBox(x, y, z, w, h, d, color) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ color: color });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.receiveShadow = true;
            scene.add(mesh);
        }

        function setupJoystick() {
            const bind = (id, xVal, zVal) => {
                const el = document.getElementById(id);
                el.addEventListener('touchstart', (e) => { moveInput.x = xVal; moveInput.z = zVal; e.preventDefault(); });
                el.addEventListener('touchend', () => { moveInput.x = 0; moveInput.z = 0; });
                el.addEventListener('mousedown', () => { moveInput.x = xVal; moveInput.z = zVal; });
                el.addEventListener('mouseup', () => { moveInput.x = 0; moveInput.z = 0; });
            };

            bind('j-up', 0, -1);
            bind('j-down', 0, 1);
            bind('j-left', -1, 0);
            bind('j-right', 1, 0);

            // Action Button Click (Enter / Exit)
            const actionBtn = document.getElementById('action-btn');
            actionBtn.addEventListener('click', () => {
                if (!isDriving) {
                    // Enter Car
                    isDriving = true;
                    player.visible = false;
                    actionBtn.innerText = "EXIT";
                    actionBtn.style.background = "rgba(50, 150, 250, 0.85)";
                } else {
                    // Exit Car
                    isDriving = false;
                    player.visible = true;
                    // Step out right next to the car
                    player.position.copy(car.position).add(new THREE.Vector3(2, 0, 0));
                    actionBtn.style.display = "none";
                    actionBtn.innerText = "ENTER";
                    actionBtn.style.background = "rgba(220, 20, 60, 0.85)";
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            const speed = 0.12;
            const actionBtn = document.getElementById('action-btn');

            if (!isDriving) {
                // Move Human Player
                player.position.x += moveInput.x * speed;
                player.position.z += moveInput.z * speed;

                // Rotate player towards movement direction
                if (moveInput.x !== 0 || moveInput.z !== 0) {
                    player.rotation.y = Math.atan2(moveInput.x, moveInput.z);
                }

                // Camera follow player
                camera.position.set(player.position.x, player.position.y + 5, player.position.z + 7);
                camera.lookAt(player.position);

                // Check distance to car to show "ENTER" button
                const dist = player.position.distanceTo(car.position);
                if (dist < 4.5) {
                    actionBtn.style.display = "flex";
                    actionBtn.innerText = "ENTER";
                } else {
                    actionBtn.style.display = "none";
                }

            } else {
                // Drive Car
                car.position.x += moveInput.x * (speed * 1.8);
                car.position.z += moveInput.z * (speed * 1.8);

                // Camera follow car smoothly
                camera.position.set(car.position.x, car.position.y + 6, car.position.z + 9);
                camera.lookAt(car.position);

                // Ensure action button stays visible as "EXIT" while driving
                actionBtn.style.display = "flex";
            }

            renderer.render(scene, camera);
        }
