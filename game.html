<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Open World Game</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Joystick styling */
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Action Button */
        #action-btn {
            position: absolute; bottom: 50px; right: 40px;
            padding: 18px 28px; font-size: 18px; font-weight: bold;
            background: #ffcc00; color: #000; border: none; border-radius: 12px;
            display: none; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <button id="action-btn">Enter Car</button>
    </div>

    <!-- Three.js Library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(20, 40, 20);
        scene.add(dirLight);

        // --- 2. ENVIRONMENT (Island & Water) ---
        // Sea
        const seaGeo = new THREE.PlaneGeometry(500, 500);
        const seaMat = new THREE.MeshBasicMaterial({ color: 0x1e90ff });
        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -0.5;
        scene.add(sea);

        // Island
        const islandGeo = new THREE.CylinderGeometry(60, 60, 1, 32);
        const islandMat = new THREE.MeshBasicMaterial({ color: 0x557a2b }); // Grass green
        const island = new THREE.Mesh(islandGeo, islandMat);
        island.position.y = -0.5;
        scene.add(island);

        // House
        const houseGeo = new THREE.BoxGeometry(6, 4, 6);
        const houseMat = new THREE.MeshLambertMaterial({ color: 0xd9d9d9 });
        const house = new THREE.Mesh(houseGeo, houseMat);
        house.position.set(0, 2, -10);
        scene.add(house);

        // House Roof
        const roofGeo = new THREE.ConeGeometry(5, 3, 4);
        const roofMat = new THREE.MeshLambertMaterial({ color: 0xb22222 });
        const roof = new THREE.Mesh(roofGeo, roofMat);
        roof.position.set(0, 5.5, -10);
        roof.rotation.y = Math.PI / 4;
        scene.add(roof);

        // --- 3. PLAYER & SPORTS CAR ---
        // Player (Minecraft-style blocky character)
        const playerGeo = new THREE.BoxGeometry(1, 2, 1);
        const playerMat = new THREE.MeshLambertMaterial({ color: 0x0055ff });
        const player = new THREE.Mesh(playerGeo, playerMat);
        player.position.set(0, 1, 0); // Spawn in front of the house
        scene.add(player);

        // Sports Car (Placed on the right side of the house)
        const carGroup = new THREE.Group();
        const carBodyGeo = new THREE.BoxGeometry(2, 1, 4);
        const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xff0000 }); // Bright Red Sports Car
        const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
        carBody.position.y = 0.5;
        carGroup.add(carBody);
        
        carGroup.position.set(8, 0, -8);
        scene.add(carGroup);

        // --- 4. GAME VARIABLES & CONTROLS ---
        let isInCar = false;
        let moveX = 0, moveY = 0; // Joystick vector values (-1 to 1)
        
        let playerSpeed = 0.15;
        let carSpeed = 0;
        let carRotation = 0;

        // Touch Joystick Logic
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        let touching = false;
        let baseRect = base.getBoundingClientRect();

        base.addEventListener('touchstart', (e) => { touching = true; handleTouch(e); });
        window.addEventListener('touchmove', (e) => { if (touching) handleTouch(e); });
        window.addEventListener('touchend', () => {
            touching = false;
            moveX = 0; moveY = 0;
            stick.style.transform = `translate(0px, 0px)`;
        });

        function handleTouch(e) {
            baseRect = base.getBoundingClientRect();
            let touch = e.touches[0];
            let centerX = baseRect.left + baseRect.width / 2;
            let centerY = baseRect.top + baseRect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let distance = Math.hypot(dx, dy);
            let maxDist = 40;

            if (distance > maxDist) {
                dx = (dx / distance) * maxDist;
                dy = (dy / distance) * maxDist;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxDist;
            moveY = -dy / maxDist; // Invert Y for forward movement
        }

        // Action Button (Enter / Exit Car)
        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('click', () => {
            isInCar = !isInCar;
            if (isInCar) {
                actionBtn.innerText = "Exit Car";
                player.visible = false; // Hide player inside car
            } else {
                actionBtn.innerText = "Enter Car";
                player.visible = true;
                // Position player right outside the car door
                player.position.set(carGroup.position.x - 2, 1, carGroup.position.z);
            }
        });

        // --- 5. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!isInCar) {
                // --- Walking Controls ---
                if (moveX !== 0 || moveY !== 0) {
                    player.position.x += moveX * playerSpeed;
                    player.position.z -= moveY * playerSpeed;
                    
                    // Face movement direction
                    player.rotation.y = Math.atan2(moveX, moveY);
                }

                // Check distance to car for entering
                let distToCar = player.position.distanceTo(carGroup.position);
                if (distToCar < 4.0) {
                    actionBtn.style.display = "block";
                } else {
                    actionBtn.style.display = "none";
                }

                // Camera follow player
                camera.position.set(player.position.x, player.position.y + 6, player.position.z + 10);
                camera.lookAt(player.position);

            } else {
                // --- Driving Controls ---
                carSpeed = moveY * 0.3; // Throttle
                if (moveX !== 0 && carSpeed !== 0) {
                    carRotation -= moveX * 0.04 * Math.sign(carSpeed);
                    carGroup.rotation.y = carRotation;
                }

                // Move car forward based on its rotation angle
                carGroup.position.x += Math.sin(carRotation) * carSpeed;
                carGroup.position.z += Math.cos(carRotation) * carSpeed;

                // Camera follow car
                let camOffsetX = -Math.sin(carRotation) * 10;
                let camOffsetZ = -Math.cos(carRotation) * 10;
                camera.position.set(carGroup.position.x + camOffsetX, carGroup.position.y + 5, carGroup.position.z + camOffsetZ);
                camera.lookAt(carGroup.position);
            }

            // Keep entities inside island boundaries
            if (player.position.length() > 55) player.position.clampLength(0, 55);
            if (carGroup.position.length() > 55) carGroup.position.clampLength(0, 55);

            renderer.render(scene, camera);
        }

        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
