<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Mini Open World Game - City & Boat Update</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Joystick styling */
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Action Buttons */
        #action-btn {
            position: absolute; bottom: 50px; right: 40px;
            padding: 18px 28px; font-size: 18px; font-weight: bold;
            background: #ffcc00; color: #000; border: none; border-radius: 12px;
            display: none; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <button id="action-btn">Enter Car</button>
    </div>

    <!-- Three.js Library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(30, 50, 30);
        scene.add(dirLight);

        // --- 2. ENVIRONMENT (Natural Island, City Roads & Buildings) ---
        // Sea
        const seaGeo = new THREE.PlaneGeometry(800, 800);
        const seaMat = new THREE.MeshBasicMaterial({ color: 0x1e90ff });
        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -0.6;
        scene.add(sea);

        // Island Base
        const islandGroup = new THREE.Group();
        const mainIslandGeo = new THREE.CylinderGeometry(60, 70, 1, 24);
        const islandMat = new THREE.MeshLambertMaterial({ color: 0x4a7c23 }); // Grass green
        const mainIsland = new THREE.Mesh(mainIslandGeo, islandMat);
        mainIsland.position.y = -0.5;
        islandGroup.add(mainIsland);
        scene.add(islandGroup);

        // --- CITY ROADS & HIGHWAYS ---
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x222222 }); // Dark asphalt
        
        // Main Horizontal Road
        const road1 = new THREE.Mesh(new THREE.BoxGeometry(100, 0.05, 8), roadMat);
        road1.position.set(0, -0.48, 0);
        scene.add(road1);

        // Main Vertical Highway
        const road2 = new THREE.Mesh(new THREE.BoxGeometry(8, 0.05, 100), roadMat);
        road2.position.set(0, -0.47, 0);
        scene.add(road2);

        // --- CITY BUILDINGS & STREET LIGHTS ---
        const buildingColors = [0x999999, 0xaaaaaa, 0x778899, 0xb0c4de, 0xdcdcdc];
        
        // Helper to build city blocks
        function createBuilding(x, z, w, h, d) {
            const bMat = new THREE.MeshLambertMaterial({ color: buildingColors[Math.floor(Math.random() * buildingColors.length)] });
            const bGeo = new THREE.BoxGeometry(w, h, d);
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set(x, h/2 - 0.5, z);
            scene.add(building);
        }

        // Spawn City Buildings around roads
        for (let x = -35; x <= 35; x += 12) {
            if (Math.abs(x) < 8) continue;
            createBuilding(x, -16, 8, 10 + Math.random() * 8, 8);
            createBuilding(x, 16, 8, 8 + Math.random() * 10, 8);
        }
        for (let z = -35; z <= 35; z += 12) {
            if (Math.abs(z) < 8) continue;
            createBuilding(-16, z, 8, 12 + Math.random() * 6, 8);
            createBuilding(16, z, 8, 9 + Math.random() * 8, 8);
        }

        // Street Lights along roads
        const poleMat = new THREE.MeshLambertMaterial({ color: 0x333333 });
        const bulbMat = new THREE.MeshBasicMaterial({ color: 0xffffaa });
        function createStreetLight(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 4), poleMat);
            pole.position.set(x, 1.5, z);
            scene.add(pole);
            const bulb = new THREE.Mesh(new THREE.SphereGeometry(0.2), bulbMat);
            bulb.position.set(x, 3.3, z);
            scene.add(bulb);
        }
        createStreetLight(6, -6); createStreetLight(-6, -6);
        createStreetLight(6, 6);  createStreetLight(-6, 6);

        // Player House
        const houseGeo = new THREE.BoxGeometry(6, 4, 6);
        const houseMat = new THREE.MeshLambertMaterial({ color: 0xd9d9d9 });
        const house = new THREE.Mesh(houseGeo, houseMat);
        house.position.set(-15, 2, -15);
        scene.add(house);

        // --- 3. DETAILED BLOCKY CHARACTER (Minecraft Style) ---
        const playerGroup = new THREE.Group();

        const torsoGeo = new THREE.BoxGeometry(0.8, 1.0, 0.4);
        const torsoMat = new THREE.MeshLambertMaterial({ color: 0x222222 }); 
        const torso = new THREE.Mesh(torsoGeo, torsoMat);
        torso.position.y = 1.1;
        playerGroup.add(torso);

        const headGeo = new THREE.BoxGeometry(0.6, 0.6, 0.6);
        const headMat = new THREE.MeshLambertMaterial({ color: 0xffdbac }); 
        const head = new THREE.Mesh(headGeo, headMat);
        head.position.y = 1.8;
        playerGroup.add(head);

        const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.3);
        const armMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const leftArm = new THREE.Mesh(armGeo, armMat);
        leftArm.position.set(-0.55, 1.1, 0);
        playerGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, armMat);
        rightArm.position.set(0.55, 1.1, 0);
        playerGroup.add(rightArm);

        const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
        const legMat = new THREE.MeshLambertMaterial({ color: 0x111155 }); 
        const leftLeg = new THREE.Mesh(legGeo, legMat);
        leftLeg.position.set(-0.2, 0.45, 0);
        playerGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, legMat);
        rightLeg.position.set(0.2, 0.45, 0);
        playerGroup.add(rightLeg);

        playerGroup.position.set(-6, 0, -6); // Spawn near house/road
        scene.add(playerGroup);

        // --- 4. DETAILED SPORTS CAR ---
        const carGroup = new THREE.Group();
        const carBodyGeo = new THREE.BoxGeometry(2.2, 0.8, 4.2);
        const carBodyMat = new THREE.MeshLambertMaterial({ color: 0xff0055 }); 
        const carBody = new THREE.Mesh(carBodyGeo, carBodyMat);
        carBody.position.y = 0.6;
        carGroup.add(carBody);

        const cabinGeo = new THREE.BoxGeometry(1.8, 0.6, 2.2);
        const cabinMat = new THREE.MeshLambertMaterial({ color: 0x222222 }); 
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.2, -0.2);
        carGroup.add(cabin);

        const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
        const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const wheels = [];
        [[-1.1, 0.35, 1.4], [1.1, 0.35, 1.4], [-1.1, 0.35, -1.4], [1.1, 0.35, -1.4]].forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            carGroup.add(wheel);
            wheels.push(wheel);
        });

        const lightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
        const headLightMat = new THREE.MeshBasicMaterial({ color: 0xffff00 }); 
        const leftHeadLight = new THREE.Mesh(lightGeo, headLightMat);
        leftHeadLight.position.set(-0.8, 0.6, 2.15);
        carGroup.add(leftHeadLight);
        const rightHeadLight = new THREE.Mesh(lightGeo, headLightMat);
        rightHeadLight.position.set(0.8, 0.6, 2.15);
        carGroup.add(rightHeadLight);

        carGroup.position.set(8, 0, 5); // Parked on city road side
        scene.add(carGroup);

        // --- 5. BOAT (On the Beach / Shoreline) ---
        const boatGroup = new THREE.Group();
        const boatHull = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.5), new THREE.MeshLambertMaterial({ color: 0x8b4513 })); // Wooden boat
        boatHull.position.y = 0.4;
        boatGroup.add(boatHull);
        const boatSeat = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.4, 1.2), new THREE.MeshLambertMaterial({ color: 0xdeb887 }));
        boatSeat.position.set(0, 0.8, 0);
        boatGroup.add(boatSeat);

        boatGroup.position.set(50, -0.2, 0); // Positioned near beach shore
        scene.add(boatGroup);

        // --- 6. GAME CONTROLS & LOGIC ---
        let vehicleState = 'none'; // 'none', 'car', 'boat'
        let moveX = 0, moveY = 0; 
        
        let playerSpeed = 0.15;
        let vehicleSpeed = 0;
        let vehicleRotation = 0;
        let walkCycle = 0;

        // Touch Joystick Logic
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        let touching = false;
        let baseRect = base.getBoundingClientRect();

        base.addEventListener('touchstart', (e) => { touching = true; handleTouch(e); });
        window.addEventListener('touchmove', (e) => { if (touching) handleTouch(e); });
        window.addEventListener('touchend', () => {
            touching = false;
            moveX = 0; moveY = 0;
            stick.style.transform = `translate(0px, 0px)`;
        });

        function handleTouch(e) {
            baseRect = base.getBoundingClientRect();
            let touch = e.touches[0];
            let centerX = baseRect.left + baseRect.width / 2;
            let centerY = baseRect.top + baseRect.height / 2;
            
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let distance = Math.hypot(dx, dy);
            let maxDist = 40;

            if (distance > maxDist) {
                dx = (dx / distance) * maxDist;
                dy = (dy / distance) * maxDist;
            }

            stick.style.transform = `translate(${dx}px, ${dy}px)`;
            moveX = dx / maxDist;
            moveY = -dy / maxDist; 
        }

        // Action Button Logic (Enter/Exit Car or Boat)
        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('click', () => {
            if (vehicleState === 'none') {
                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);

                if (distToCar < 4.5) {
                    vehicleState = 'car';
                    playerGroup.visible = false;
                    actionBtn.innerText = "Exit Car";
                } else if (distToBoat < 5.0) {
                    vehicleState = 'boat';
                    playerGroup.visible = false;
                    actionBtn.innerText = "Exit Boat";
                }
            } else if (vehicleState === 'car') {
                vehicleState = 'none';
                playerGroup.visible = true;
                playerGroup.position.set(carGroup.position.x - 2.5, 0, carGroup.position.z);
                actionBtn.innerText = "Enter Car";
            } else if (vehicleState === 'boat') {
                vehicleState = 'none';
                playerGroup.visible = true;
                playerGroup.position.set(boatGroup.position.x - 3, 0, boatGroup.position.z);
                actionBtn.innerText = "Enter Boat";
            }
        });

        // --- 7. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (vehicleState === 'none') {
                // --- Character Walking ---
                if (moveX !== 0 || moveY !== 0) {
                    playerGroup.position.x += moveX * playerSpeed;
                    playerGroup.position.z -= moveY * playerSpeed;
                    playerGroup.rotation.y = Math.atan2(moveX, moveY);

                    walkCycle += 0.2;
                    leftArm.rotation.x = Math.sin(walkCycle) * 0.5;
                    rightArm.rotation.x = -Math.sin(walkCycle) * 0.5;
                    leftLeg.rotation.x = -Math.sin(walkCycle) * 0.5;
                    rightLeg.rotation.x = Math.sin(walkCycle) * 0.5;
                } else {
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0;
                    leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                }

                // Proximity check for UI prompts
                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);

                if (distToCar < 4.5) {
                    actionBtn.innerText = "Enter Car";
                    actionBtn.style.display = "block";
                } else if (distToBoat < 5.0) {
                    actionBtn.innerText = "Enter Boat";
                    actionBtn.style.display = "block";
                } else {
                    actionBtn.style.display = "none";
                }

                camera.position.set(playerGroup.position.x, playerGroup.position.y + 6, playerGroup.position.z + 10);
                camera.lookAt(playerGroup.position);

            } else if (vehicleState === 'car') {
                // --- Car Driving ---
                let targetSpeed = moveY * 0.35;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.1;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.05 * Math.sign(vehicleSpeed);
                    carGroup.rotation.y = vehicleRotation;
                }

                carGroup.position.x += Math.sin(vehicleRotation) * vehicleSpeed;
                carGroup.position.z += Math.cos(vehicleRotation) * vehicleSpeed;
                wheels.forEach(wheel => { wheel.rotation.x += vehicleSpeed * 2; });

                let camOffsetX = -Math.sin(vehicleRotation) * 12;
                let camOffsetZ = -Math.cos(vehicleRotation) * 12;
                camera.position.set(carGroup.position.x + camOffsetX, carGroup.position.y + 5, carGroup.position.z + camOffsetZ);
                camera.lookAt(carGroup.position);

            } else if (vehicleState === 'boat') {
                // --- Boat Sailing on Water ---
                let targetSpeed = moveY * 0.25;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.08;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.04 * Math.sign(vehicleSpeed);
                    boatGroup.rotation.y = vehicleRotation;
                }

                boatGroup.position.x += Math.sin(vehicleRotation) * vehicleSpeed;
                boatGroup.position.z += Math.cos(vehicleRotation) * vehicleSpeed;

                let camOffsetX = -Math.sin(vehicleRotation) * 14;
                let camOffsetZ = -Math.cos(vehicleRotation) * 14;
                camera.position.set(boatGroup.position.x + camOffsetX, boatGroup.position.y + 6, boatGroup.position.z + camOffsetZ);
                camera.lookAt(boatGroup.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
