<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>City Driving - RONISH Gaming</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; }
        
        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        .steering-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            align-self: flex-end;
        }
        .pedals-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            pointer-events: auto;
            align-items: flex-end;
        }
        
        .steer-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid #FFD700;
            color: #FFD700;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }
        .steer-btn:active {
            background: rgba(255, 215, 0, 0.5);
            transform: scale(0.92);
        }

        .pedal-btn {
            width: 65px;
            height: 50px;
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid #FFD700;
            color: #FFD700;
            font-size: 0.9rem;
            font-weight: bold;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
            text-transform: uppercase;
        }
        .pedal-btn:active {
            background: rgba(255, 215, 0, 0.5);
            transform: scale(0.95);
        }

        #speedometer {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #FFD700;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 6px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            border: 1px solid #FFD700;
            font-size: 1rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="speedometer">SPEED: 0 MPH</div>

    <div class="controls-container">
        <div class="steering-group">
            <button class="steer-btn" id="leftBtn">◀</button>
            <button class="steer-btn" id="rightBtn">▶</button>
        </div>
        <div class="pedals-group">
            <button class="pedal-btn" id="accelBtn">GAS</button>
            <button class="pedal-btn" id="brakeBtn">BRAKE</button>
        </div>
    </div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffea79, 0.9);
        dirLight.position.set(30, 50, 30);
        scene.add(dirLight);

        // --- CITY MAP & WHITE ROAD MARKINGS ---
        const cityGroup = new THREE.Group();
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.9 });
        
        const mainRoadX = new THREE.Mesh(new THREE.PlaneGeometry(300, 32), roadMat);
        mainRoadX.rotation.x = -Math.PI / 2;
        mainRoadX.position.y = 0.01;
        cityGroup.add(mainRoadX);

        const mainRoadZ = new THREE.Mesh(new THREE.PlaneGeometry(32, 300), roadMat);
        mainRoadZ.rotation.x = -Math.PI / 2;
        mainRoadZ.position.y = 0.02;
        cityGroup.add(mainRoadZ);

            dashX.position.set(i, 0.03, 0);
            cityGroup.add(dashX);
