<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World 3D - Ultimate GTA Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* GTA Style HUD Overlay */
        #minimap {
            position: absolute; top: 15px; left: 15px;
            width: 140px; height: 100px;
            background: rgba(20, 30, 40, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
        }
        #hud-stats {
            position: absolute; top: 15px; right: 15px;
            text-align: right; color: white; font-weight: bold; font-size: 13px;
            text-shadow: 1px 1px 2px #000;
        }
        .bar-container { width: 120px; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; margin-top: 4px; display: inline-block; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); }
        .health-fill { width: 100%; height: 100%; background: #2ecc71; }
        .armor-fill { width: 80%; height: 100%; background: #3498db; }

        /* Joystick styling (Left) */
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Action Button (Right) */
        #action-btn {
            position: absolute; bottom: 50px; right: 40px;
            padding: 18px 28px; font-size: 18px; font-weight: bold;
            background: #ffcc00; color: #000; border: none; border-radius: 12px;
            display: none; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="minimap"></div>
        <div id="hud-stats">
            <div>HEALTH <div class="bar-container"><div class="health-fill"></div></div></div>
            <div>ARMOR <div class="bar-container"><div class="armor-fill"></div></div></div>
            <div style="margin-top: 10px; font-size: 16px; color: #ffcc00;">$15,200,400</div>
            <div style="margin-top: 10px; font-size: 14px;">AMMO 120/500</div>
        </div>

        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <button id="action-btn">Enter</button>
    </div>

    <!-- Three.js Library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(100, 150, 100);
        scene.add(dirLight);

        // --- 2. MASSIVE ENVIRONMENT & MOUNTAIN ---
        const sea = new THREE.Mesh(new THREE.PlaneGeometry(3500, 3500), new THREE.MeshBasicMaterial({ color: 0x1e90ff }));
        sea.rotation.x = -Math.PI / 2; sea.position.y = -0.6; scene.add(sea);

        const islandMat = new THREE.MeshLambertMaterial({ color: 0x4e6e3d }); 
        const mainIsland = new THREE.Mesh(new THREE.CylinderGeometry(320, 340, 1, 32), islandMat);
        mainIsland.position.y = -0.5; scene.add(mainIsland);

        // Huge Mountain (Vinewood Hills)
        const mountain = new THREE.Mesh(new THREE.ConeGeometry(100, 80, 16), new THREE.MeshLambertMaterial({ color: 0x6e5c46 }));
        mountain.position.set(-160, 40, -160);
        scene.add(mountain);

        // Airport Runway & Area
        const runwayMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
        const runway = new THREE.Mesh(new THREE.BoxGeometry(45, 0.08, 280), runwayMat);
        runway.position.set(180, -0.46, 0);
        scene.add(runway);

        // --- ROADS WITH WHITE STRIPES & SIGNBOARDS ---
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a }); 
        const road1 = new THREE.Mesh(new THREE.BoxGeometry(600, 0.06, 16), roadMat); road1.position.set(0, -0.47, 0); scene.add(road1);
        const road2 = new THREE.Mesh(new THREE.BoxGeometry(16, 0.06, 600), roadMat); road2.position.set(0, -0.46, 0); scene.add(road2);

        // Road White Center Stripes
        const stripeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for(let i = -280; i <= 280; i += 20) {
            const stripe = new THREE.Mesh(new THREE.BoxGeometry(2, 0.07, 6), stripeMat);
            stripe.position.set(0, -0.45, i);
            scene.add(stripe);
        }

        // 3D Signboards (Airport & City Guide)
        function createSignboard(x, z, textRot, label) {
            const post = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 3), new THREE.MeshLambertMaterial({ color: 0x333333 }));
            post.position.set(x, 1.5, z); scene.add(post);
            const board = new THREE.Mesh(new THREE.BoxGeometry(3.5, 1.2, 0.2), new THREE.MeshLambertMaterial({ color: 0x27ae60 }));
            board.position.set(x, 3.2, z); board.rotation.y = textRot;
            scene.add(board);
        }
        createSignboard(12, -25, 0, "To City Center");
        createSignboard(120, -50, Math.PI/2, "To Airport ->");

        // Traffic Lights at Crossings
        function createTrafficLight(x, z) {
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 5), new THREE.MeshLambertMaterial({ color: 0x444444 }));
            pole.position.set(x, 2.5, z); scene.add(pole);
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.8, 0.5), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            box.position.set(x, 4.5, z); scene.add(box);
        }
        createTrafficLight(10, 10); createTrafficLight(-10, -10);

        // Solid Buildings with Collisions
        const solidObjects = [];
        function createBuilding(x, z, w, h, d, colorHex) {
            const bMat = new THREE.MeshLambertMaterial({ color: colorHex || 0x7f8c8d });
            const bGeo = new THREE.BoxGeometry(w, h, d);
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set(x, h/2 - 0.5, z);
            scene.add(building);
            solidObjects.push({ x, z, w: w + 1.2, d: d + 1.2 });
        }

        for (let x = -200; x <= 200; x += 38) {
            if (Math.abs(x) < 22 || x > 120) continue;
            createBuilding(x, -55, 18, 45 + Math.random() * 30, 18, 0x95a5a6);
            createBuilding(x, 55, 18, 40 + Math.random() * 35, 18, 0xbdc3c7);
        }
        for (let z = -200; z <= 200; z += 38) {
            if (Math.abs(z) < 22) continue;
            createBuilding(-55, z, 18, 50 + Math.random() * 25, 18, 0x7f8c8d);
            createBuilding(55, z, 18, 55 + Math.random() * 20, 18, 0x95a5a6);
        }

        // --- 3. DETAILED NPC PEOPLE (Walking with Limbs) & TRAFFIC CARS ---
        const npcPeople = [];
        function createDetailedNPC(x, z) {
            const npcGroup = new THREE.Group();
            const torso = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.9, 0.35), new THREE.MeshLambertMaterial({ color: 0x9b59b6 }));
            torso.position.y = 1.0; npcGroup.add(torso);
            const head = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.5, 0.5), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
            head.position.y = 1.6; npcGroup.add(head);
            npcGroup.position.set(x, 0, z);
            scene.add(npcGroup);
            solidObjects.push({ x, z, w: 1.0, d: 1.0, isDynamic: true, mesh: npcGroup });
            npcPeople.push({ group: npcGroup, xMin: x - 10, xMax: x + 10, speed: 0.04, dir: 1 });
        }
        createDetailedNPC(-14, -15); createDetailedNPC(14, 25); createDetailedNPC(-18, 35);

        // Traffic Cars (Solid & Movable)
        const trafficCars = [];
        function spawnTrafficCar(x, z, color) {
            const carGroup = new THREE.Group();
            const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 0.85, 4.1), new THREE.MeshLambertMaterial({ color }));
            body.position.y = 0.5; carGroup.add(body);
            const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.7, 0.55, 2.1), new THREE.MeshLambertMaterial({ color: 0x111111 }));
            cabin.position.set(0, 1.1, -0.2); carGroup.add(cabin);
            carGroup.position.set(x, 0, z);
            scene.add(carGroup);
            solidObjects.push({ x, z, w: 2.5, d: 4.5, isDynamic: true, mesh: carGroup });
            trafficCars.push({ group: carGroup, zMin: -220, zMax: 220, speed: 0.35 });
        }
        spawnTrafficCar(-5, 50, 0xe74c3c); // Red car
        spawnTrafficCar(5, -70, 0xf1c40f); // Yellow car
        spawnTrafficCar(-5, 120, 0x3498db); // Blue car

        // --- 4. PLAYER, SPORTS CAR, SPEED BOAT & AIRPLANE ---
        const playerGroup = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0x2c3e50 }));
        torso.position.y = 1.1; playerGroup.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
        head.position.y = 1.8; playerGroup.add(head);
        
        const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.3);
        const armMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
        const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-0.55, 1.1, 0); playerGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(0.55, 1.1, 0); playerGroup.add(rightArm);
        
        const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
        const legMat = new THREE.MeshLambertMaterial({ color: 0x1a252f });
        const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.2, 0.45, 0); playerGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.2, 0.45, 0); playerGroup.add(rightLeg);

        playerGroup.position.set(-20, 0, -20);
        scene.add(playerGroup);

        // Sports Car (Player Driveable)
        const carGroup = new THREE.Group();
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.2), new THREE.MeshLambertMaterial({ color: 0xd35400 }));
        carBody.position.y = 0.6; carGroup.add(carBody);
        const carCabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), new THREE.MeshLambertMaterial({ color: 0x111111 }));
        carCabin.position.set(0, 1.2, -0.2); carGroup.add(carCabin);
        carGroup.position.set(20, 0, 15);
        scene.add(carGroup);

        // Speed Boat
        const boatGroup = new THREE.Group();
        const boatHull = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 5.0), new THREE.MeshLambertMaterial({ color: 0x2980b9 }));
        boatHull.position.y = 0.3; boatGroup.add(boatHull);
        boatGroup.position.set(300, -0.2, 0);
        scene.add(boatGroup);

        // Airplane (At Airport)
        const planeGroup = new THREE.Group();
        const fuselage = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2.5, 12), new THREE.MeshLambertMaterial({ color: 0xecf0f1 }));
        fuselage.position.y = 1.5; planeGroup.add(fuselage);
        const wings = new THREE.Mesh(new THREE.BoxGeometry(16, 0.3, 3.5), new THREE.MeshLambertMaterial({ color: 0xbdc3c7 }));
        wings.position.set(0, 1.5, 0); planeGroup.add(wings);
        const tail = new THREE.Mesh(new THREE.BoxGeometry(0.3, 2.5, 2), new THREE.MeshLambertMaterial({ color: 0xe74c3c }));
        tail.position.set(0, 3, -5); planeGroup.add(tail);
        planeGroup.position.set(180, 0, -60);
        scene.add(planeGroup);

        // --- 5. CONTROLS & PHYSICS COLLISION ---
        let vehicleState = 'none'; // 'none', 'car', 'boat', 'plane'
        let moveX = 0, moveY = 0; 
        let playerSpeed = 0.18;
        let vehicleSpeed = 0;
        let vehicleRotation = 0;
        let planeAltitude = 0;
        let walkCycle = 0;

        let cameraAngleY = 0;
        let cameraAngleX = 0.5;
        let isDragging = false;
        let prevTouchX = 0, prevTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX > window.innerWidth / 2) {
                isDragging = true;
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                let dx = e.touches[0].clientX - prevTouchX;
                let dy = e.touches[0].clientY - prevTouchY;
                cameraAngleY -= dx * 0.005;
                cameraAngleX = Math.max(0.1, Math.min(1.2, cameraAngleX + dy * 0.005));
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // Joystick
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        let touchingJoystick = false;

        base.addEventListener('touchstart', (e) => { touchingJoystick = true; handleJoystick(e); });
        window.addEventListener('touchmove', (e) => { if (touchingJoystick) handleJoystick(e); });
        window.addEventListener('touchend', () => {
            touchingJoystick = false;
            moveX = 0; moveY = 0;
            stick.style.transform = `translate(0px, 0px)`;
        });

        function handleJoystick(e) {
            let baseRect = base.getBoundingClientRect();
            for (let i = 0; i < e.touches.length; i++) {
                let touch = e.touches[i];
                if (touch.clientX < window.innerWidth / 2) {
                    let centerX = baseRect.left + baseRect.width / 2;
                    let centerY = baseRect.top + baseRect.height / 2;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 40;

                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist;
                    moveY = -dy / maxDist;
                    return;
                }
            }
        }

        // Action Button
        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('click', () => {
            if (vehicleState === 'none') {
                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);
                let distToPlane = playerGroup.position.distanceTo(planeGroup.position);

                if (distToCar < 4.5) {
                    vehicleState = 'car'; playerGroup.visible = false; actionBtn.innerText = "Exit Car";
                } else if (distToBoat < 6.0) {
                    vehicleState = 'boat'; playerGroup.visible = false; actionBtn.innerText = "Exit Boat";
                } else if (distToPlane < 8.0) {
                    vehicleState = 'plane'; playerGroup.visible = false; actionBtn.innerText = "Exit Plane";
                }
            } else if (vehicleState === 'car') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(carGroup.position.x - 2.5, 0, carGroup.position.z);
                actionBtn.innerText = "Enter";
            } else if (vehicleState === 'boat') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(boatGroup.position.x - 3, 0, boatGroup.position.z);
                actionBtn.innerText = "Enter";
            } else if (vehicleState === 'plane') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(planeGroup.position.x - 4, 0, planeGroup.position.z);
                planeGroup.position.y = 0;
                actionBtn.innerText = "Enter";
            }
        });

        // Solid Collision Checker (Prevents walking or driving through buildings/objects)
        function checkCollision(nx, nz, radius = 0.8) {
            for (let obj of solidObjects) {
                if (Math.abs(nx - obj.x) < (obj.w / 2 + radius) && Math.abs(nz - obj.z) < (obj.d / 2 + radius)) {
                    return true;
                }
            }
            return false;
        }

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Animate Traffic Cars
            trafficCars.forEach(car => {
                car.group.position.z += car.speed;
                if (car.group.position.z > car.zMax) car.group.position.z = car.zMin;
                // Update dynamic collision coordinate
                let obj = solidObjects.find(o => o.mesh === car.group);
                if (obj) obj.z = car.group.position.z;
            });

            // Animate NPCs
            npcPeople.forEach(p => {
                p.group.position.x += p.speed * p.dir;
                if (p.group.position.x > p.xMax || p.group.position.x < p.xMin) p.dir *= -1;
                let obj = solidObjects.find(o => o.mesh === p.group);
                if (obj) obj.x = p.group.position.x;
            });

            if (vehicleState === 'none') {
                if (moveX !== 0 || moveY !== 0) {
                    let moveAngle = Math.atan2(moveX, moveY) + cameraAngleY;
                    let nx = playerGroup.position.x + Math.sin(moveAngle) * playerSpeed;
                    let nz = playerGroup.position.z + Math.cos(moveAngle) * playerSpeed;

                    if (!checkCollision(nx, nz, 0.5)) {
                        playerGroup.position.x = nx;
                        playerGroup.position.z = nz;
                    }
                    playerGroup.rotation.y = moveAngle;

                    walkCycle += 0.2;
                    leftArm.rotation.x = Math.sin(walkCycle) * 0.5; rightArm.rotation.x = -Math.sin(walkCycle) * 0.5;
                    leftLeg.rotation.x = -Math.sin(walkCycle) * 0.5; rightLeg.rotation.x = Math.sin(walkCycle) * 0.5;
                } else {
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0; leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                }

                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);
                let distToPlane = playerGroup.position.distanceTo(planeGroup.position);

                if (distToCar < 4.5) { actionBtn.innerText = "Enter Car"; actionBtn.style.display = "block"; }
                else if (distToBoat < 6.0) { actionBtn.innerText = "Enter Boat"; actionBtn.style.display = "block"; }
                else if (distToPlane < 8.0) { actionBtn.innerText = "Enter Plane"; actionBtn.style.display = "block"; }
                else { actionBtn.style.display = "none"; }

                let camX = playerGroup.position.x + Math.sin(cameraAngleY) * 12 * Math.cos(cameraAngleX);
                let camY = playerGroup.position.y + 3 + Math.sin(cameraAngleX) * 10;
                let camZ = playerGroup.position.z + Math.cos(cameraAngleY) * 12 * Math.cos(cameraAngleX);
                camera.position.set(camX, camY, camZ);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            } else if (vehicleState === 'car') {
                let targetSpeed = moveY * 0.45;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.1;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.05 * Math.sign(vehicleSpeed);
                    carGroup.rotation.y = vehicleRotation;
                }

                let nx = carGroup.position.x + Math.sin(vehicleRotation) * vehicleSpeed;
                let nz = carGroup.position.z + Math.cos(vehicleRotation) * vehicleSpeed;
                if (!checkCollision(nx, nz, 1.2)) {
                    carGroup.position.x = nx; carGroup.position.z = nz;
                }

                camera.position.set(carGroup.position.x - Math.sin(vehicleRotation) * 14, carGroup.position.y + 5, carGroup.position.z - Math.cos(vehicleRotation) * 14);
                camera.lookAt(carGroup.position);

            } else if (vehicleState === 'boat') {
                let targetSpeed = moveY * 0.35;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.08;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.04 * Math.sign(vehicleSpeed);
                    boatGroup.rotation.y = vehicleRotation;
                }

                boatGroup.position.x += Math.sin(vehicleRotation) * vehicleSpeed;
                boatGroup.position.z += Math.cos(vehicleRotation) * vehicleSpeed;

                camera.position.set(boatGroup.position.x - Math.sin(vehicleRotation) * 16, boatGroup.position.y + 6, boatGroup.position.z - Math.cos(vehicleRotation) * 16);
                camera.lookAt(boatGroup.position);

            } else if (vehicleState === 'plane') {
                let targetSpeed = moveY * 0.65;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.05;

                if (moveX !== 0) {
                    vehicleRotation -= moveX * 0.04;
                    planeGroup.rotation.y = vehicleRotation;
                }

                if (vehicleSpeed > 0.1) {
                    planeAltitude += (moveY * 0.25);
                    planeAltitude = Math.max(1, Math.min(180, planeAltitude));
                }

                planeGroup.position.y = planeAltitude;
                planeGroup.position.x += Math.sin(vehicleRotation) * vehicleSpeed;
                planeGroup.position.z += Math.cos(vehicleRotation) * vehicleSpeed;

                camera.position.set(
                    planeGroup.position.x - Math.sin(vehicleRotation) * 24, 
                    planeGroup.position.y + 8, 
                    planeGroup.position.z - Math.cos(vehicleRotation) * 24
                );
                camera.lookAt(planeGroup.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
