<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World 3D - GTA V Vibe Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* GTA Style HUD Overlay */
        #minimap {
            position: absolute; top: 15px; left: 15px;
            width: 140px; height: 100px;
            background: rgba(20, 30, 40, 0.7);
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 6px;
        }
        #hud-stats {
            position: absolute; top: 15px; right: 15px;
            text-align: right; color: white; font-weight: bold; font-size: 13px;
            text-shadow: 1px 1px 2px #000;
        }
        .bar-container { width: 120px; height: 8px; background: rgba(0,0,0,0.5); border-radius: 4px; margin-top: 4px; display: inline-block; overflow: hidden; border: 1px solid rgba(255,255,255,0.3); }
        .health-fill { width: 100%; height: 100%; background: #2ecc71; }
        .armor-fill { width: 80%; height: 100%; background: #3498db; }

        /* Joystick styling (Left) */
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Action Button (Right) */
        #action-btn {
            position: absolute; bottom: 50px; right: 40px;
            padding: 18px 28px; font-size: 18px; font-weight: bold;
            background: #ffcc00; color: #000; border: none; border-radius: 12px;
            display: none; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="ui">
        <!-- Mini Map Mockup -->
        <div id="minimap"></div>

        <!-- Stats & Weapon HUD -->
        <div id="hud-stats">
            <div>HEALTH <div class="bar-container"><div class="health-fill"></div></div></div>
            <div>ARMOR <div class="bar-container"><div class="armor-fill"></div></div></div>
            <div style="margin-top: 10px; font-size: 16px; color: #ffcc00;">$8,450,210</div>
            <div style="margin-top: 10px; font-size: 14px;">AMMO 45/180</div>
        </div>

        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <button id="action-btn">Enter</button>
    </div>

    <!-- Three.js Library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // --- 2. ENVIRONMENT & LOS SANTOS VIBE CITY ---
        // Sea & Beach
        const sea = new THREE.Mesh(new THREE.PlaneGeometry(1800, 1800), new THREE.MeshBasicMaterial({ color: 0x1e90ff }));
        sea.rotation.x = -Math.PI / 2; sea.position.y = -0.6; scene.add(sea);

        const beach = new THREE.Mesh(new THREE.CylinderGeometry(150, 160, 0.9, 32), new THREE.MeshLambertMaterial({ color: 0xf4d06f }));
        beach.position.y = -0.55; scene.add(beach);

        // Ground / City Blocks Base
        const islandMat = new THREE.MeshLambertMaterial({ color: 0x555555 }); // Pavement gray
        const mainIsland = new THREE.Mesh(new THREE.CylinderGeometry(130, 140, 1, 32), islandMat);
        mainIsland.position.y = -0.5; scene.add(mainIsland);

        // --- HIGHWAYS & ROADS ---
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x1a1a1a }); 
        const road1 = new THREE.Mesh(new THREE.BoxGeometry(260, 0.06, 14), roadMat); road1.position.set(0, -0.47, 0); scene.add(road1);
        const road2 = new THREE.Mesh(new THREE.BoxGeometry(14, 0.06, 260), roadMat); road2.position.set(0, -0.46, 0); scene.add(road2);

        // Buildings & Skyscrapers with Collision List
        const buildings = [];
        function createBuilding(x, z, w, h, d, colorHex) {
            const bMat = new THREE.MeshLambertMaterial({ color: colorHex || 0x7f8c8d });
            const bGeo = new THREE.BoxGeometry(w, h, d);
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set(x, h/2 - 0.5, z);
            scene.add(building);
            buildings.push({ x, z, w: w + 1, d: d + 1 });
        }

        // Generate Tall Skyscrapers (Vinewood / Downtown Vibe)
        for (let x = -90; x <= 90; x += 25) {
            if (Math.abs(x) < 18) continue;
            createBuilding(x, -35, 16, 35 + Math.random() * 25, 16, 0x95a5a6);
            createBuilding(x, 35, 16, 25 + Math.random() * 30, 16, 0xbdc3c7);
        }
        for (let z = -90; z <= 90; z += 25) {
            if (Math.abs(z) < 18) continue;
            createBuilding(-35, z, 16, 30 + Math.random() * 20, 16, 0x7f8c8d);
            createBuilding(35, z, 16, 40 + Math.random() * 15, 16, 0x95a5a6);
        }

        // Palm Trees along streets
        function createPalmTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 5), new THREE.MeshLambertMaterial({ color: 0x8b5a2b }));
            trunk.position.set(x, 2, z); scene.add(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(3, 3, 5), new THREE.MeshLambertMaterial({ color: 0x27ae60 }));
            leaves.position.set(x, 5, z); scene.add(leaves);
        }
        createPalmTree(-10, -10); createPalmTree(10, -10); createPalmTree(-10, 10); createPalmTree(10, 10);

        // --- 3. TRAFFIC CARS & NPC PEDESTRIANS (AI Simulation) ---
        const npcCars = [];
        const npcPeople = [];

        function spawnTrafficCar(x, z, color, speed) {
            const car = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.9, 4.0), new THREE.MeshLambertMaterial({ color }));
            car.position.set(x, 0.45, z);
            scene.add(car);
            npcCars.push({ mesh: car, zMin: -120, zMax: 120, speed });
        }
        spawnTrafficCar(-4, 20, 0xe74c3c, 0.4); // Red Sedan
        spawnTrafficCar(4, -40, 0xf1c40f, 0.5); // Yellow Taxi
        spawnTrafficCar(-4, 60, 0x34495e, 0.35); // Dark SUV

        function spawnPedestrian(x, z) {
            const person = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xe67e22 }));
            person.position.set(x, 0.8, z);
            scene.add(person);
            npcPeople.push({ mesh: person, xMin: x - 5, xMax: x + 5, speed: 0.05, dir: 1 });
        }
        spawnPedestrian(-12, -5); spawnPedestrian(12, 15); spawnPedestrian(-15, 25);

        // --- 4. PLAYER CHARACTER & VEHICLES ---
        const playerGroup = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0x2c3e50 })); // Tactical jacket
        torso.position.y = 1.1; playerGroup.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
        head.position.y = 1.8; playerGroup.add(head);
        
        const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.3);
        const armMat = new THREE.MeshLambertMaterial({ color: 0x2c3e50 });
        const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-0.55, 1.1, 0); playerGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(0.55, 1.1, 0); playerGroup.add(rightArm);
        
        const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
        const legMat = new THREE.MeshLambertMaterial({ color: 0x1a252f });
        const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.2, 0.45, 0); playerGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.2, 0.45, 0); playerGroup.add(rightLeg);

        playerGroup.position.set(-15, 0, -15);
        scene.add(playerGroup);

        // Sports Car (Parked on Street)
        const carGroup = new THREE.Group();
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.2), new THREE.MeshLambertMaterial({ color: 0xd35400 }));
        carBody.position.y = 0.6; carGroup.add(carBody);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), new THREE.MeshLambertMaterial({ color: 0x111111 }));
        cabin.position.set(0, 1.2, -0.2); carGroup.add(cabin);
        carGroup.position.set(15, 0, 10);
        scene.add(carGroup);

        // Speed Boat (Water Shore)
        const boatGroup = new THREE.Group();
        const boatHull = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 5.0), new THREE.MeshLambertMaterial({ color: 0x2980b9 }));
        boatHull.position.y = 0.3; boatGroup.add(boatHull);
        boatGroup.position.set(150, -0.2, 0);
        scene.add(boatGroup);

        // --- 5. CONTROLS & TOUCH LOGIC ---
        let vehicleState = 'none'; // 'none', 'car', 'boat'
        let moveX = 0, moveY = 0; 
        let playerSpeed = 0.18;
        let vehicleSpeed = 0;
        let vehicleRotation = 0;
        let walkCycle = 0;

        // Camera Swipe (Free Fire Style)
        let cameraAngleY = 0;
        let cameraAngleX = 0.5;
        let isDragging = false;
        let prevTouchX = 0, prevTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            if (e.touches[0].clientX > window.innerWidth / 2) {
                isDragging = true;
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                let dx = e.touches[0].clientX - prevTouchX;
                let dy = e.touches[0].clientY - prevTouchY;
                cameraAngleY -= dx * 0.005;
                cameraAngleX = Math.max(0.1, Math.min(1.2, cameraAngleX + dy * 0.005));
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // Touch Joystick
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        let touchingJoystick = false;

        base.addEventListener('touchstart', (e) => { touchingJoystick = true; handleJoystick(e); });
        window.addEventListener('touchmove', (e) => { if (touchingJoystick) handleJoystick(e); });
        window.addEventListener('touchend', () => {
            touchingJoystick = false;
            moveX = 0; moveY = 0;
            stick.style.transform = `translate(0px, 0px)`;
        });

        function handleJoystick(e) {
            let baseRect = base.getBoundingClientRect();
            for (let i = 0; i < e.touches.length; i++) {
                let touch = e.touches[i];
                if (touch.clientX < window.innerWidth / 2) {
                    let centerX = baseRect.left + baseRect.width / 2;
                    let centerY = baseRect.top + baseRect.height / 2;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 40;

                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist;
                    moveY = -dy / maxDist;
                    return;
                }
            }
        }

        // Action Button
        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('click', () => {
            if (vehicleState === 'none') {
                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);

                if (distToCar < 4.5) {
                    vehicleState = 'car'; playerGroup.visible = false; actionBtn.innerText = "Exit Car";
                } else if (distToBoat < 6.0) {
                    vehicleState = 'boat'; playerGroup.visible = false; actionBtn.innerText = "Exit Boat";
                }
            } else if (vehicleState === 'car') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(carGroup.position.x - 2.5, 0, carGroup.position.z);
                actionBtn.innerText = "Enter";
            } else if (vehicleState === 'boat') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(boatGroup.position.x - 3, 0, boatGroup.position.z);
                actionBtn.innerText = "Enter";
            }
        });

        function checkCollision(nx, nz) {
            for (let b of buildings) {
                if (Math.abs(nx - b.x) < b.w / 2 && Math.abs(nz - b.z) < b.d / 2) return true;
            }
            return false;
        }

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            // Animate Traffic NPC Cars
            npcCars.forEach(car => {
                car.mesh.position.z += car.speed;
                if (car.mesh.position.z > car.zMax) car.mesh.position.z = car.zMin;
            });

            // Animate Pedestrians
            npcPeople.forEach(p => {
                p.mesh.position.x += p.speed * p.dir;
                if (p.mesh.position.x > p.xMax || p.mesh.position.x < p.xMin) p.dir *= -1;
            });

            if (vehicleState === 'none') {
                if (moveX !== 0 || moveY !== 0) {
                    let moveAngle = Math.atan2(moveX, moveY) + cameraAngleY;
                    let nx = playerGroup.position.x + Math.sin(moveAngle) * playerSpeed;
                    let nz = playerGroup.position.z + Math.cos(moveAngle) * playerSpeed;

                    if (!checkCollision(nx, nz)) {
                        playerGroup.position.x = nx;
                        playerGroup.position.z = nz;
                    }
                    playerGroup.rotation.y = moveAngle;

                    walkCycle += 0.2;
                    leftArm.rotation.x = Math.sin(walkCycle) * 0.5; rightArm.rotation.x = -Math.sin(walkCycle) * 0.5;
                    leftLeg.rotation.x = -Math.sin(walkCycle) * 0.5; rightLeg.rotation.x = Math.sin(walkCycle) * 0.5;
                } else {
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0; leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                }

                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);
                if (distToCar < 4.5) { actionBtn.innerText = "Enter Car"; actionBtn.style.display = "block"; }
                else if (distToBoat < 6.0) { actionBtn.innerText = "Enter Boat"; actionBtn.style.display = "block"; }
                else { actionBtn.style.display = "none"; }

                let camX = playerGroup.position.x + Math.sin(cameraAngleY) * 12 * Math.cos(cameraAngleX);
                let camY = playerGroup.position.y + 3 + Math.sin(cameraAngleX) * 10;
                let camZ = playerGroup.position.z + Math.cos(cameraAngleY) * 12 * Math.cos(cameraAngleX);
                camera.position.set(camX, camY, camZ);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            } else if (vehicleState === 'car') {
                let targetSpeed = moveY * 0.4;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.1;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.05 * Math.sign(vehicleSpeed);
                    carGroup.rotation.y = vehicleRotation;
                }

                let nx = carGroup.position.x + Math.sin(vehicleRotation) * vehicleSpeed;
                let nz = carGroup.position.z + Math.cos(vehicleRotation) * vehicleSpeed;
                if (!checkCollision(nx, nz)) {
                    carGroup.position.x = nx; carGroup.position.z = nz;
                }

                camera.position.set(carGroup.position.x - Math.sin(vehicleRotation) * 14, carGroup.position.y + 5, carGroup.position.z - Math.cos(vehicleRotation) * 14);
                camera.lookAt(carGroup.position);

            } else if (vehicleState === 'boat') {
                let targetSpeed = moveY * 0.35;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.08;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.04 * Math.sign(vehicleSpeed);
                    boatGroup.rotation.y = vehicleRotation;
                }

                boatGroup.position.x += Math.sin(vehicleRotation) * vehicleSpeed;
                boatGroup.position.z += Math.cos(vehicleRotation) * vehicleSpeed;

                camera.position.set(boatGroup.position.x - Math.sin(vehicleRotation) * 16, boatGroup.position.y + 6, boatGroup.position.z - Math.cos(vehicleRotation) * 16);
                camera.lookAt(boatGroup.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
