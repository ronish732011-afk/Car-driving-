<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>City Driving - RONISH Gaming</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; }
        
        /* Layout for Touch Controls */
        .controls-container {
            position: absolute;
            bottom: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        .steering-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            align-items: center;
        }
        .pedals-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            pointer-events: auto;
            align-items: flex-end;
        }
        .touch-btn {
            width: 65px;
            height: 65px;
            background: rgba(255, 215, 0, 0.15);
            border: 2px solid #FFD700;
            color: #FFD700;
            font-size: 1.3rem;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
        }
        .touch-btn:active {
            background: rgba(255, 215, 0, 0.5);
            transform: scale(0.92);
        }
        #speedometer {
            position: absolute;
            top: 15px;
            right: 20px;
            color: #FFD700;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 6px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            border: 1px solid #FFD700;
            font-size: 1rem;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="speedometer">SPEED: 0 MPH</div>

    <!-- Custom Control Layout matching your drawing -->
    <div class="controls-container">
        <!-- Left Side: Steering -->
        <div class="steering-group">
            <button class="touch-btn" id="leftBtn">◀</button>
            <button class="touch-btn" id="rightBtn">▶</button>
        </div>
        
        <!-- Right Side: Separate Accelerator (W), Reverse (S), and Brake (Space/Extra) -->
        <div class="pedals-group">
            <button class="touch-btn" id="accelBtn">▲</button>
            <button class="touch-btn" id="brakeBtn" style="border-color: #ff4757; color: #ff4757; background: rgba(255, 71, 87, 0.15);">■</button>
            <button class="touch-btn" id="reverseBtn">▼</button>
        </div>
    </div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x050510);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffea79, 0.8);
        dirLight.position.set(30, 50, 30);
        scene.add(dirLight);

        // --- CITY MAP BUILDER ---
        const cityGroup = new THREE.Group();
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.9 });
        
        const mainRoadX = new THREE.Mesh(new THREE.PlaneGeometry(300, 30), roadMat);
        mainRoadX.rotation.x = -Math.PI / 2;
        mainRoadX.position.y = 0.01;
        cityGroup.add(mainRoadX);

        const mainRoadZ = new THREE.Mesh(new THREE.PlaneGeometry(30, 300), roadMat);
        mainRoadZ.rotation.x = -Math.PI / 2;
        mainRoadZ.position.y = 0.02;
        cityGroup.add(mainRoadZ);

        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x222629, roughness: 0.4 });
        const buildingPositions = [
            [-50, -50], [-50, 50], [50, -50], [50, 50],
            [-100, -50], [-100, 50], [100, -50], [100, 50],
            [-50, -100], [50, -100], [-50, 100], [50, 100]
        ];

        buildingPositions.forEach(([x, z]) => {
            const width = 30;
            const height = 25 + Math.random() * 25;
            const depth = 30;
            const bGeo = new THREE.BoxGeometry(width, height, depth);
            const building = new THREE.Mesh(bGeo, buildingMat);
            building.position.set(x, height / 2, z);
            cityGroup.add(building);
        });
        scene.add(cityGroup);

        // --- DETAILED YELLOW PORSCHE MODEL WITH BRAKE LIGHTS ---
        const carGroup = new THREE.Group();

        const lowerGeo = new THREE.BoxGeometry(2.1, 0.4, 4.2);
        const carMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, metalness: 0.6, roughness: 0.2 });
        const lowerBody = new THREE.Mesh(lowerGeo, carMat);
        lowerBody.position.y = 0.35;
        carGroup.add(lowerBody);

        const cabinGeo = new THREE.BoxGeometry(1.7, 0.45, 2.0);
        const glassMat = new THREE.MeshStandardMaterial({ color: 0x111111, metalness: 0.9, roughness: 0.1 });
        const cabin = new THREE.Mesh(cabinGeo, glassMat);
        cabin.position.set(0, 0.75, -0.2);
        carGroup.add(cabin);

        const spoilerGeo = new THREE.BoxGeometry(1.9, 0.1, 0.6);
        const spoiler = new THREE.Mesh(spoilerGeo, carMat);
        spoiler.position.set(0, 0.9, -1.8);
        carGroup.add(spoiler);

        // Headlights
        const headLightMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        const leftHeadLight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headLightMat);
        leftHeadLight.position.set(-0.7, 0.4, 2.1);
        carGroup.add(leftHeadLight);
        const rightHeadLight = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.15, 0.1), headLightMat);
        rightHeadLight.position.set(0.7, 0.4, 2.1);
        carGroup.add(rightHeadLight);

        // ** Glowing Rear Brake Lights **
        const brakeLightMatOff = new THREE.MeshBasicMaterial({ color: 0x550000 }); // Dim dark red when not braking
        const brakeLightMatOn = new THREE.MeshBasicMaterial({ color: 0xff0000 });   // Bright glowing red when braking
        
        const brakeGeo = new THREE.BoxGeometry(0.4, 0.15, 0.1);
        const leftBrakeLight = new THREE.Mesh(brakeGeo, brakeLightMatOff);
        leftBrakeLight.position.set(-0.7, 0.4, -2.1);
        carGroup.add(leftBrakeLight);

        const rightBrakeLight = new THREE.Mesh(brakeGeo, brakeLightMatOff);
        rightBrakeLight.position.set(0.7, 0.4, -2.1);
        carGroup.add(rightBrakeLight);

        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x1b1b1b });
        const wheels = [
            [-1.1, 0.4, 1.4], [1.1, 0.4, 1.4],
            [-1.1, 0.4, -1.4], [1.1, 0.4, -1.4]
        ];
        wheels.forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos);
            carGroup.add(wheel);
        });

        scene.add(carGroup);

        camera.position.set(0, 4, -8);
        camera.lookAt(carGroup.position);

        // Controls State
        let speed = 0;
        let steering = 0;
        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function bindTouch(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => keys[keyName] = true);
            btn.addEventListener('mouseup', () => keys[keyName] = false);
        }

        bindTouch('leftBtn', 'a');
        bindTouch('rightBtn', 'd');
        bindTouch('accelBtn', 'w');      // Accelerate Up
        bindTouch('reverseBtn', 's');   // Reverse Down
        bindTouch('brakeBtn', ' ');     // Brake Button (Spacebar / Red Square)

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            let isBraking = false;

            // Separate controls logic
            if (keys['w']) {
                speed = Math.min(speed + 0.025, 0.9);
            } else if (keys['s']) {
                speed = Math.max(speed - 0.025, -0.3); // Reverse
            } else if (keys[' ']) { // Brake button pressed
                speed *= 0.85; // Hard braking slowdown
                isBraking = true;
            } else {
                speed *= 0.96; // Natural coasting friction
            }

            //
