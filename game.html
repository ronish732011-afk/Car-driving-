<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>City Driving - RONISH Gaming</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; user-select: none; -webkit-user-select: none; }
        
        .controls-container {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 35px;
            box-sizing: border-box;
            z-index: 10;
            pointer-events: none;
        }
        .steering-group {
            display: flex;
            gap: 20px;
            pointer-events: auto;
            align-self: flex-end;
        }
        .pedals-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
            pointer-events: auto;
            align-items: flex-end;
        }
        
        .steer-btn {
            width: 75px;
            height: 75px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
            color: #FFD700;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
        }
        .steer-btn:active {
            background: rgba(255, 215, 0, 0.6);
            transform: scale(0.92);
        }

        .pedal-btn {
            width: 65px;
            height: 42px;
            background: rgba(255, 215, 0, 0.2);
            border: 2px solid #FFD700;
            color: #FFD700;
            font-size: 0.8rem;
            font-weight: bold;
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            outline: none;
            backdrop-filter: blur(4px);
            -webkit-tap-highlight-color: transparent;
            box-shadow: 0 0 10px rgba(255, 215, 0, 0.3);
            text-transform: uppercase;
        }
        .pedal-btn:active {
            background: rgba(255, 215, 0, 0.6);
            transform: scale(0.95);
        }

        #hud {
            position: absolute;
            top: 15px;
            right: 20px;
            display: flex;
            gap: 15px;
            z-index: 10;
        }
        .hud-box {
            color: #FFD700;
            background: rgba(0,0,0,0.7);
            padding: 8px 15px;
            border-radius: 6px;
            font-family: 'Segoe UI', sans-serif;
            font-weight: bold;
            border: 1px solid #FFD700;
            font-size: 0.95rem;
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-box" id="timeDisplay">TIME: DAY</div>
        <div class="hud-box" id="speedometer">SPEED: 0 MPH</div>
    </div>

    <!-- Controls with Gas, Brake, and Rev Pedals -->
    <div class="controls-container">
        <div class="steering-group">
            <button class="steer-btn" id="leftBtn">◀</button>
            <button class="steer-btn" id="rightBtn">▶</button>
        </div>
        <div class="pedals-group">
            <button class="pedal-btn" id="accelBtn">GAS</button>
            <button class="pedal-btn" id="brakeBtn">BRAKE</button>
            <button class="pedal-btn" id="revBtn">REV</button>
        </div>
    </div>

    <!-- Include Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x70b5ff);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        
        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(40, 80, 40);
        scene.add(dirLight);

        // --- CITY ROAD MAP & ROADSIDE TREES ---
        const roadMat = new THREE.MeshStandardMaterial({ color: 0x181818, roughness: 0.9 });
        const mainRoadX = new THREE.Mesh(new THREE.PlaneGeometry(400, 32), roadMat);
        mainRoadX.rotation.x = -Math.PI / 2;
        mainRoadX.position.y = 0.01;
        scene.add(mainRoadX);

        const mainRoadZ = new THREE.Mesh(new THREE.PlaneGeometry(32, 400), roadMat);
        mainRoadZ.rotation.x = -Math.PI / 2;
        mainRoadZ.position.y = 0.02;
        scene.add(mainRoadZ);

        // White Road Stripes
        const whiteLineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
        for (let i = -190; i < 190; i += 15) {
            const dashX = new THREE.Mesh(new THREE.BoxGeometry(5, 0.04, 0.3), whiteLineMat);
            dashX.position.set(i, 0.03, 0);
            scene.add(dashX);

            const dashZ = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.04, 5), whiteLineMat);
            dashZ.position.set(0, 0.03, i);
            scene.add(dashZ);
        }

        // Roadside Trees Generator
        const treeLeafMat = new THREE.MeshStandardMaterial({ color: 0x2d6a4f, roughness: 0.6 });
        const treeBarkMat = new THREE.MeshStandardMaterial({ color: 0x6f4e37, roughness: 0.8 });

        function createTree(x, z) {
            const treeGroup = new THREE.Group();
            // Trunk
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 2, 8), treeBarkMat);
            trunk.position.y = 1;
            treeGroup.add(trunk);
            // Leaves
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(1.5, 3, 8), treeLeafMat);
            leaves.position.y = 3;
            treeGroup.add(leaves);

            treeGroup.position.set(x, 0, z);
            scene.add(treeGroup);
        }

        // Place trees along the road borders
        for (let p = -180; p <= 180; p += 25) {
            if (Math.abs(p) > 25) {
                createTree(18, p);
                createTree(-18, p);
                createTree(p, 18);
                createTree(p, -18);
            }
        }

        // Buildings
        const buildingMat = new THREE.MeshStandardMaterial({ color: 0x222629 });
        const buildingPositions = [
            [-60, -60], [-60, 60], [60, -60], [60, 60],
            [-120, -60], [-120, 60], [120, -60], [120, 60],
            [-60, -120], [60, -120], [-60, 120], [60, 120]
        ];
        buildingPositions.forEach(([x, z]) => {
            const h = 35;
            const b = new THREE.Mesh(new THREE.BoxGeometry(28, h, 28), buildingMat);
            b.position.set(x, h/2, z);
            scene.add(b);
        });


        // --- PLAYER YELLOW PORSCHE WITH AUTO HEADLIGHTS ---
        const carGroup = new THREE.Group();

        const bodyGeo = new THREE.BoxGeometry(2.2, 0.8, 4.5);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0xFFD700, roughness: 0.2 });
        const carBody = new THREE.Mesh(bodyGeo, bodyMat);
        carBody.position.y = 0.6;
        carGroup.add(carBody);

        const cabinGeo = new THREE.BoxGeometry(1.6, 0.7, 2.2);
        const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
        const cabin = new THREE.Mesh(cabinGeo, cabinMat);
        cabin.position.set(0, 1.3, -0.2);
        carGroup.add(cabin);

        // Headlight Meshes & Spotlights (Auto turn on at night)
        const headLightGeo = new THREE.BoxGeometry(0.4, 0.2, 0.1);
        const headLightMat = new THREE.MeshBasicMaterial({ color: 0x333333 }); // Off by default in day
        
        const leftHead = new THREE.Mesh(headLightGeo, headLightMat);
        leftHead.position.set(-0.7, 0.6, 2.3);
        carGroup.add(leftHead);

        const rightHead = new THREE.Mesh(headLightGeo, headLightMat);
        rightHead.position.set(0.7, 0.6, 2.3);
        carGroup.add(rightHead);

        // Real illuminating spotlights attached to car for night driving
        const carSpotLight = new THREE.SpotLight(0xffffff, 0, 50, Math.PI / 4, 0.5, 2);
        carSpotLight.position.set(0, 1, 2.3);
        carSpotLight.target.position.set(0, 0, 10);
        carGroup.add(carSpotLight);
        carGroup.add(carSpotLight.target);

        // Brake Lights
        const brakeLightMat = new THREE.MeshBasicMaterial({ color: 0x330000 });
        const leftBrake = new THREE.Mesh(headLightGeo, brakeLightMat);
        leftBrake.position.set(-0.7, 0.6, -2.3);
        carGroup.add(leftBrake);

        const rightBrake = new THREE.Mesh(headLightGeo, brakeLightMat);
        rightBrake.position.set(0.7, 0.6, -2.3);
        carGroup.add(rightBrake);

        // Wheels
        const wheelGeo = new THREE.CylinderGeometry(0.5, 0.5, 0.35, 16);
        const wheelMat = new THREE.MeshStandardMaterial({ color: 0x111111 });
        const wheelCoords = [
            [-1.2, 0.5, 1.5], [1.2, 0.5, 1.5],
            [-1.2, 0.5, -1.5], [1.2, 0.5, -1.5]
        ];
        wheelCoords.forEach(pos => {
            const w = new THREE.Mesh(wheelGeo, wheelMat);
            w.rotation.z = Math.PI / 2;
            w.position.set(...pos);
            carGroup.add(w);
        });

        scene.add(carGroup);


        // --- AI TRAFFIC CARS ---
        const trafficCars = [];
        const trafficColors = [0xffffff, 0xef233c, 0x2b2d42, 0x3a86ff, 0x38b000];

        for (let i = 0; i < 6; i++) {
            const tGroup = new THREE.Group();
            const color = trafficColors[Math.floor(Math.random() * trafficColors.length)];
            const tBody = new THREE.Mesh(
                new THREE.BoxGeometry(2.1, 0.7, 4.2),
                new THREE.MeshStandardMaterial({ color: color, roughness: 0.3 })
            );
            tBody.position.y = 0.55;
            tGroup.add(tBody);

            tGroup.position.set((Math.random() - 0.5) * 200, 0, (Math.random() - 0.5) * 200);
            scene.add(tGroup);
            
            trafficCars.push({
                mesh: tGroup,
                speed: 0.3 + Math.random() * 0.3,
                direction: Math.random() > 0.5 ? 'x' : 'z'
            });
        }


        // Camera setup
        camera.position.set(0, 4, -9);
        camera.lookAt(carGroup.position);

        // Controls & Game State
        let speed = 0;
        let steering = 0;
        const keys = {};

        window.addEventListener('keydown', (e) => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', (e) => keys[e.key.toLowerCase()] = false);

        function bindTouch(id, keyName) {
            const btn = document.getElementById(id);
            btn.addEventListener('touchstart', (e) => { e.preventDefault(); keys[keyName] = true; });
            btn.addEventListener('touchend', (e) => { e.preventDefault(); keys[keyName] = false; });
            btn.addEventListener('mousedown', () => keys[keyName] = true);
            btn.addEventListener('mouseup', () => keys[keyName] = false);
        }

        bindTouch('leftBtn', 'a');
        bindTouch('rightBtn', 'd');
        bindTouch('accelBtn', 'w');
        bindTouch('brakeBtn', 's');
        bindTouch('revBtn', 'r'); // Bind Rev/Reverse pedal

        let gameTimeSeconds = 0;

        // Game Loop
        function animate() {
            requestAnimationFrame(animate);

            // Day & Night Cycle (10 minutes total loop: 5 mins Day, 5 mins Night)
            gameTimeSeconds += 0.016;
            const cycleProgress = (gameTimeSeconds % 600) / 600;
            const isNight = cycleProgress >= 0.5;
            
            document.getElementById('timeDisplay').innerText = isNight ? "TIME: NIGHT" : "TIME: DAY";

            if (isNight) {
                scene.background.setHex(0x050510);
                dirLight.color.setHex(0x4466aa);
                dirLight.intensity = 0.2;
                ambientLight.intensity = 0.2;
                // Turn headlights ON automatically at night
                headLightMat.color.setHex(0xffffff);
                carSpotLight.intensity = 3.0;
            } else {
                scene.background.setHex(0x70b5ff);
                dirLight.color.setHex(0xffffff);
                dirLight.intensity = 1.2;
                ambientLight.intensity = 0.8;
                // Turn headlights OFF during the day
                headLightMat.color.setHex(0x333333);
                carSpotLight.intensity = 0;
            }

            let isBraking = false;

            if (keys['w'] || keys['arrowup']) {
                speed = Math.min(speed + 0.025, 0.9);
            } else if (keys['s'] || keys['arrowdown']) {
                if (speed > 0.02) {
                    speed = Math.max(speed - 0.04, 0);
                    isBraking = true; // Brake lights glow
                } else {
                    speed = Math.max(speed - 0.02, -0.3);
                }
            } else if (keys['r']) {
                // Reverse pedal action
                speed = Math.max(speed - 0.02, -0.4);
            } else {
                speed *= 0.95;
            }

            // Glow brake lights red when braking
            if (isBraking) {
                brakeLightMat.color.setHex(0xff0000);
            } else {
                brakeLightMat.color.setHex(0x330000);
            }

            if (keys['a'] || keys['arrowleft']) steering = 0.045;
            else if (keys['d'] || keys['arrowright']) steering = -0.045;
            else steering = 0;

            carGroup.rotation.y += steering * (speed * 1.5);
            carGroup.translateZ(speed);

            // Move Traffic AI Cars
            trafficCars.forEach(car => {
                if (car.direction === 'x') {
                    car.mesh.position.x += car.speed;
                    car.mesh.rotation.y = car.speed > 0 ? 0 : Math.PI;
                    if (car.mesh.position.x > 200) car.mesh.position.x = -200;
                } else {
                    car.mesh.position.z += car.speed;
                    car.mesh.rotation.y = car.speed > 0 ? Math.PI / 2 : -Math.PI / 2;
                    if (car.mesh.position.z > 200) car.mesh.position.z = -200;
                }
            });

            document.getElementById('speedometer').innerText = `SPEED: ${Math.round(Math.abs(speed) * 120)} MPH`;

            // Camera follow
            const offset = new THREE.Vector3(0, 3.5, -8).applyAxisAngle(new THREE.Vector3(0, 1, 0), carGroup.rotation.y);
            camera.position.copy(carGroup.position).add(offset);
            camera.lookAt(carGroup.position);

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
