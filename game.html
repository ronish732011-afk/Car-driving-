<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Open World Game</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            font-family: 'Courier New', Courier, monospace;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 16px;
            text-align: center;
            pointer-events: none;
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 24px;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">Use <b>W, A, S, D</b> to Walk/Drive | Approach Car & Press <b>F</b> to Enter/Exit</div>
    <div id="crosshair">+</div>

    <!-- Include Three.js from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. SCENE, CAMERA, & RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // --- 2. LIGHTING ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // --- 3. WORLD (Island, Roads, House) ---
        // Ground / Island
        const groundGeo = new THREE.PlaneGeometry(500, 500);
        const groundMat = new THREE.MeshLambertMaterial({ color: 0x38a169 }); // Green grass
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Roads
        const roadMat = new THREE.MeshLambertMaterial({ color: 0x2d3748 });
        const roadX = new THREE.Mesh(new THREE.PlaneGeometry(500, 20), roadMat);
        roadX.rotation.x = -Math.PI / 2;
        roadX.position.y = 0.05;
        scene.add(roadX);

        const roadZ = new THREE.Mesh(new THREE.PlaneGeometry(20, 500), roadMat);
        roadZ.rotation.x = -Math.PI / 2;
        roadZ.position.y = 0.06;
        scene.add(roadZ);

        // House (Center)
        const houseGroup = new THREE.Group();
        const wallsMat = new THREE.MeshLambertMaterial({ color: 0x718096 });
        const walls = new THREE.Mesh(new THREE.BoxGeometry(15, 10, 15), wallsMat);
        walls.position.y = 5;
        houseGroup.add(walls);

        const roofMat = new THREE.MeshLambertMaterial({ color: 0xc53030 });
        const roof = new THREE.Mesh(new THREE.ConeGeometry(12, 6, 4), roofMat);
        roof.position.y = 13;
        roof.rotation.y = Math.PI / 4;
        houseGroup.add(roof);

        houseGroup.position.set(0, 0, -25);
        scene.add(houseGroup);

        // --- 4. CAR ---
        const carGroup = new THREE.Group();
        const carBodyMat = new THREE.MeshLambertMaterial({ color: 0x3182ce });
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(6, 3, 10), carBodyMat);
        carBody.position.y = 1.5;
        carGroup.add(carBody);

        const carTopMat = new THREE.MeshLambertMaterial({ color: 0x63b3ed });
        const carTop = new THREE.Mesh(new THREE.BoxGeometry(4, 2, 5), carTopMat);
        carTop.position.set(0, 3.5, 0);
        carGroup.add(carTop);

        // Parked on the right side of the road
        carGroup.position.set(18, 0, 15);
        scene.add(carGroup);

        // --- 5. PLAYER ---
        const player = {
            x: 0,
            y: 2,
            z: 10,
            speed: 0.3,
            inCar: false,
            angle: 0
        };

        // Car Physics Variables
        let carSpeed = 0;
        let carAngle = 0;

        // Input Controls
        const keys = {};
        window.addEventListener('keydown', (e) => {
            keys[e.key.toLowerCase()] = true;
            if (e.key.toLowerCase() === 'f') {
                toggleCar();
            }
        });
        window.addEventListener('keyup', (e) => {
            keys[e.key.toLowerCase()] = false;
        });

        function toggleCar() {
            let dist = Math.hypot(player.x - carGroup.position.x, player.z - carGroup.position.z);
            if (!player.inCar && dist < 8) {
                player.inCar = true;
            } else if (player.inCar) {
                player.inCar = false;
                // Step out to the side
                player.x = carGroup.position.x - 6;
                player.z = carGroup.position.z;
            }
        }

        // --- 6. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (!player.inCar) {
                // Walking Controls (Minecraft style)
                if (keys['w']) { player.z -= player.speed; }
                if (keys['s']) { player.z += player.speed; }
                if (keys['a']) { player.x -= player.speed; }
                if (keys['d']) { player.x += player.speed; }

                // Camera follows player (Third-person view behind player)
                camera.position.set(player.x, player.y + 6, player.z + 12);
                camera.lookAt(player.x, player.y, player.z);

            } else {
                // Driving Controls (GTA style car physics)
                if (keys['w']) { carSpeed = Math.min(carSpeed + 0.02, 0.8); }
                else if (keys['s']) { carSpeed = Math.max(carSpeed - 0.02, -0.4); }
                else { carSpeed *= 0.95; } // friction

                if (keys['a']) { carAngle += 0.03 * (carSpeed / 0.8); }
                if (keys['d']) { carAngle -= 0.03 * (carSpeed / 0.8); }

                carGroup.rotation.y = carAngle;
                carGroup.position.x += Math.sin(carAngle) * carSpeed;
                carGroup.position.z += Math.cos(carAngle) * carSpeed;

                // Sync player to car position
                player.x = carGroup.position.x;
                player.z = carGroup.position.z;

                // Camera follows car from behind
                let camX = carGroup.position.x - Math.sin(carAngle) * 15;
                let camZ = carGroup.position.z - Math.cos(carAngle) * 15;
                camera.position.set(camX, carGroup.position.y + 6, camZ);
                camera.lookAt(carGroup.position.x, carGroup.position.y + 2, carGroup.position.z);
            }

            // Display UI prompt dynamically based on distance to car
            let distToCar = Math.hypot(player.x - carGroup.position.x, player.z - carGroup.position.z);
            const uiDiv = document.getElementById('ui');
            if (!player.inCar && distToCar < 8) {
                uiDiv.innerHTML = "<b>Press [F] to Enter Car</b>";
            } else if (player.inCar) {
                uiDiv.innerHTML = "<b>Press [F] to Exit Car</b> | Use W,A,S,D to Drive";
            } else {
                uiDiv.innerHTML = "Use <b>W, A, S, D</b> to Walk | Approach Car & Press <b>F</b> to Enter";
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle Window Resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>

</body>
</html>
