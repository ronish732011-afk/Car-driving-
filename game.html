<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Open World 3D - Ultimate Edition</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; }
        #ui { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; }
        
        /* Joystick styling (Left) */
        #joystick-base {
            position: absolute; bottom: 40px; left: 40px;
            width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-stick {
            position: absolute; top: 35px; left: 35px;
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.6);
            border-radius: 50%;
            pointer-events: none;
        }

        /* Action Button (Right) */
        #action-btn {
            position: absolute; bottom: 50px; right: 40px;
            padding: 18px 28px; font-size: 18px; font-weight: bold;
            background: #ffcc00; color: #000; border: none; border-radius: 12px;
            display: none; pointer-events: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }

        /* Camera Touch Area Indicator */
        #camera-hint {
            position: absolute; top: 20px; right: 20px; color: white; background: rgba(0,0,0,0.4);
            padding: 8px 12px; border-radius: 8px; font-size: 12px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="ui">
        <div id="joystick-base">
            <div id="joystick-stick"></div>
        </div>
        <button id="action-btn">Enter</button>
        <div id="camera-hint">Swipe screen to look around</div>
    </div>

    <!-- Three.js Library from CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // --- 1. SETUP SCENE, CAMERA, RENDERER ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1500);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Lights
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
        dirLight.position.set(50, 100, 50);
        scene.add(dirLight);

        // --- 2. ENVIRONMENT (Huge Organic Island, Sandy Beach & Sea) ---
        // Vast Sea
        const seaGeo = new THREE.PlaneGeometry(1500, 1500);
        const seaMat = new THREE.MeshBasicMaterial({ color: 0x1e90ff });
        const sea = new THREE.Mesh(seaGeo, seaMat);
        sea.rotation.x = -Math.PI / 2;
        sea.position.y = -0.6;
        scene.add(sea);

        // Big Sandy Beach Ring (Outer edge)
        const beachGeo = new THREE.CylinderGeometry(130, 140, 0.9, 32);
        const beachMat = new THREE.MeshLambertMaterial({ color: 0xf4d06f }); // Sand color
        const beach = new THREE.Mesh(beachGeo, beachMat);
        beach.position.y = -0.55;
        scene.add(beach);

        // Huge Main Grass Island (Irregular shape via multi-cylinders)
        const islandGroup = new THREE.Group();
        const mainIslandGeo = new THREE.CylinderGeometry(110, 125, 1, 32);
        const islandMat = new THREE.MeshLambertMaterial({ color: 0x4a7c23 }); // Grass green
        const mainIsland = new THREE.Mesh(mainIslandGeo, islandMat);
        mainIsland.position.y = -0.5;
        islandGroup.add(mainIsland);

        // Side extensions for organic layout
        const ext1 = new THREE.Mesh(new THREE.CylinderGeometry(60, 70, 1, 16), islandMat);
        ext1.position.set(80, -0.5, 40);
        islandGroup.add(ext1);

        const ext2 = new THREE.Mesh(new THREE.CylinderGeometry(55, 65, 1, 16), islandMat);
        ext2.position.set(-85, -0.5, -60);
        islandGroup.add(ext2);
        scene.add(islandGroup);

        // --- 3. ROADS & BUILDINGS (With Collision Data) ---
        const roadMat = new THREE.MeshBasicMaterial({ color: 0x222222 }); 
        const road1 = new THREE.Mesh(new THREE.BoxGeometry(220, 0.05, 12), roadMat);
        road1.position.set(0, -0.48, 0);
        scene.add(road1);

        const road2 = new THREE.Mesh(new THREE.BoxGeometry(12, 0.05, 220), roadMat);
        road2.position.set(0, -0.47, 0);
        scene.add(road2);

        // Buildings List for Collision Checking
        const buildings = [];
        function createBuilding(x, z, w, h, d) {
            const bMat = new THREE.MeshLambertMaterial({ color: 0x8899aa });
            const bGeo = new THREE.BoxGeometry(w, h, d);
            const building = new THREE.Mesh(bGeo, bMat);
            building.position.set(x, h/2 - 0.5, z);
            scene.add(building);
            
            // Store bounding box data for collision detection
            buildings.push({ x, z, w: w + 1, d: d + 1 });
        }

        // Generate City Grid
        for (let x = -70; x <= 70; x += 22) {
            if (Math.abs(x) < 15) continue;
            createBuilding(x, -30, 14, 18 + Math.random() * 12, 14);
            createBuilding(x, 30, 14, 15 + Math.random() * 15, 14);
        }
        for (let z = -70; z <= 70; z += 22) {
            if (Math.abs(z) < 15) continue;
            createBuilding(-30, z, 14, 20 + Math.random() * 10, 14);
            createBuilding(30, z, 14, 16 + Math.random() * 14, 14);
        }

        // Trees on Island
        const treeTrunkMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b });
        const treeLeavesMat = new THREE.MeshLambertMaterial({ color: 0x2e8b57 });
        function createTree(x, z) {
            const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.4, 3), treeTrunkMat);
            trunk.position.set(x, 1, z);
            scene.add(trunk);
            const leaves = new THREE.Mesh(new THREE.ConeGeometry(2, 4, 6), treeLeavesMat);
            leaves.position.set(x, 3.5, z);
            scene.add(leaves);
        }
        createTree(-25, -25); createTree(25, -25); createTree(-25, 25); createTree(45, 45);

        // Distant Cargo Ships in the Sea
        const shipMat = new THREE.MeshLambertMaterial({ color: 0x444444 });
        function createShip(x, z) {
            const ship = new THREE.Mesh(new THREE.BoxGeometry(15, 6, 40), shipMat);
            ship.position.set(x, 2.5, z);
            scene.add(ship);
        }
        createShip(300, 250); createShip(-350, -300);

        // Player House
        const house = new THREE.Mesh(new THREE.BoxGeometry(8, 5, 8), new THREE.MeshLambertMaterial({ color: 0xd9d9d9 }));
        house.position.set(-35, 2.5, -35);
        scene.add(house);
        buildings.push({ x: -35, z: -35, w: 9, d: 9 });

        // --- 4. DETAILED BLOCKY CHARACTER ---
        const playerGroup = new THREE.Group();
        const torso = new THREE.Mesh(new THREE.BoxGeometry(0.8, 1.0, 0.4), new THREE.MeshLambertMaterial({ color: 0x222222 }));
        torso.position.y = 1.1; playerGroup.add(torso);
        const head = new THREE.Mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshLambertMaterial({ color: 0xffdbac }));
        head.position.y = 1.8; playerGroup.add(head);
        
        const armGeo = new THREE.BoxGeometry(0.25, 0.9, 0.3);
        const armMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
        const leftArm = new THREE.Mesh(armGeo, armMat); leftArm.position.set(-0.55, 1.1, 0); playerGroup.add(leftArm);
        const rightArm = new THREE.Mesh(armGeo, armMat); rightArm.position.set(0.55, 1.1, 0); playerGroup.add(rightArm);
        
        const legGeo = new THREE.BoxGeometry(0.3, 0.9, 0.3);
        const legMat = new THREE.MeshLambertMaterial({ color: 0x111155 });
        const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.2, 0.45, 0); playerGroup.add(leftLeg);
        const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.2, 0.45, 0); playerGroup.add(rightLeg);

        playerGroup.position.set(-15, 0, -15);
        scene.add(playerGroup);

        // --- 5. SPORTS CAR ---
        const carGroup = new THREE.Group();
        const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.2), new THREE.MeshLambertMaterial({ color: 0xff0055 }));
        carBody.position.y = 0.6; carGroup.add(carBody);
        const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2.2), new THREE.MeshLambertMaterial({ color: 0x222222 }));
        cabin.position.set(0, 1.2, -0.2); carGroup.add(cabin);

        const wheelGeo = new THREE.CylinderGeometry(0.35, 0.35, 0.3, 16);
        const wheelMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
        const wheels = [];
        [[-1.1, 0.35, 1.4], [1.1, 0.35, 1.4], [-1.1, 0.35, -1.4], [1.1, 0.35, -1.4]].forEach(pos => {
            const wheel = new THREE.Mesh(wheelGeo, wheelMat);
            wheel.rotation.z = Math.PI / 2;
            wheel.position.set(...pos); carGroup.add(wheel); wheels.push(wheel);
        });
        carGroup.position.set(15, 0, 15);
        scene.add(carGroup);

        // --- 6. REAL SPEED BOAT (On Water Shore) ---
        const boatGroup = new THREE.Group();
        const boatHull = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.7, 5.0), new THREE.MeshLambertMaterial({ color: 0x0044cc })); // Blue Speedboat
        boatHull.position.y = 0.3; boatGroup.add(boatHull);
        const windshield = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.5, 0.8), new THREE.MeshBasicMaterial({ color: 0x88ccff }));
        windshield.position.set(0, 0.7, 0.5); boatGroup.add(windshield);
        
        boatGroup.position.set(135, -0.2, 0); // Positioned right at the edge of the water/beach
        scene.add(boatGroup);

        // --- 7. GAME CONTROLS & FREE FIRE STYLE CAMERA DRAG ---
        let vehicleState = 'none'; // 'none', 'car', 'boat'
        let moveX = 0, moveY = 0; 
        
        let playerSpeed = 0.18;
        let vehicleSpeed = 0;
        let vehicleRotation = 0;
        let walkCycle = 0;

        // Camera Orbit Rotation (Free Fire Swipe style)
        let cameraAngleY = 0;
        let cameraAngleX = 0.5;
        let isDragging = false;
        let prevTouchX = 0, prevTouchY = 0;

        window.addEventListener('touchstart', (e) => {
            // If touch is on right side of screen, enable camera drag
            if (e.touches[0].clientX > window.innerWidth / 2) {
                isDragging = true;
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchmove', (e) => {
            if (isDragging) {
                let dx = e.touches[0].clientX - prevTouchX;
                let dy = e.touches[0].clientY - prevTouchY;
                cameraAngleY -= dx * 0.005;
                cameraAngleX = Math.max(0.1, Math.min(1.2, cameraAngleX + dy * 0.005));
                prevTouchX = e.touches[0].clientX;
                prevTouchY = e.touches[0].clientY;
            }
        });

        window.addEventListener('touchend', () => { isDragging = false; });

        // Touch Joystick (Left Side)
        const base = document.getElementById('joystick-base');
        const stick = document.getElementById('joystick-stick');
        let touchingJoystick = false;

        base.addEventListener('touchstart', (e) => { touchingJoystick = true; handleJoystick(e); });
        window.addEventListener('touchmove', (e) => { if (touchingJoystick) handleJoystick(e); });
        window.addEventListener('touchend', () => {
            touchingJoystick = false;
            moveX = 0; moveY = 0;
            stick.style.transform = `translate(0px, 0px)`;
        });

        function handleJoystick(e) {
            let baseRect = base.getBoundingClientRect();
            // Find touch inside joystick base
            for (let i = 0; i < e.touches.length; i++) {
                let touch = e.touches[i];
                if (touch.clientX < window.innerWidth / 2) {
                    let centerX = baseRect.left + baseRect.width / 2;
                    let centerY = baseRect.top + baseRect.height / 2;
                    let dx = touch.clientX - centerX;
                    let dy = touch.clientY - centerY;
                    let dist = Math.hypot(dx, dy);
                    let maxDist = 40;

                    if (dist > maxDist) {
                        dx = (dx / dist) * maxDist;
                        dy = (dy / dist) * maxDist;
                    }
                    stick.style.transform = `translate(${dx}px, ${dy}px)`;
                    moveX = dx / maxDist;
                    moveY = -dy / maxDist;
                    return;
                }
            }
        }

        // Action Button
        const actionBtn = document.getElementById('action-btn');
        actionBtn.addEventListener('click', () => {
            if (vehicleState === 'none') {
                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);

                if (distToCar < 4.5) {
                    vehicleState = 'car'; playerGroup.visible = false; actionBtn.innerText = "Exit Car";
                } else if (distToBoat < 6.0) {
                    vehicleState = 'boat'; playerGroup.visible = false; actionBtn.innerText = "Exit Boat";
                }
            } else if (vehicleState === 'car') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(carGroup.position.x - 2.5, 0, carGroup.position.z);
                actionBtn.innerText = "Enter";
            } else if (vehicleState === 'boat') {
                vehicleState = 'none'; playerGroup.visible = true;
                playerGroup.position.set(boatGroup.position.x - 3, 0, boatGroup.position.z);
                actionBtn.innerText = "Enter";
            }
        });

        // Collision Checker function against buildings
        function checkCollision(nx, nz) {
            for (let b of buildings) {
                if (Math.abs(nx - b.x) < b.w / 2 && Math.abs(nz - b.z) < b.d / 2) {
                    return true; // Collision detected
                }
            }
            return false;
        }

        // --- 8. GAME LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            if (vehicleState === 'none') {
                // --- Walking with Collision & Camera Rotation ---
                if (moveX !== 0 || moveY !== 0) {
                    // Calculate movement relative to camera angle
                    let moveAngle = Math.atan2(moveX, moveY) + cameraAngleY;
                    let nx = playerGroup.position.x + Math.sin(moveAngle) * playerSpeed;
                    let nz = playerGroup.position.z + Math.cos(moveAngle) * playerSpeed;

                    // Apply building collision check
                    if (!checkCollision(nx, nz)) {
                        playerGroup.position.x = nx;
                        playerGroup.position.z = nz;
                    }
                    playerGroup.rotation.y = moveAngle;

                    walkCycle += 0.2;
                    leftArm.rotation.x = Math.sin(walkCycle) * 0.5; rightArm.rotation.x = -Math.sin(walkCycle) * 0.5;
                    leftLeg.rotation.x = -Math.sin(walkCycle) * 0.5; rightLeg.rotation.x = Math.sin(walkCycle) * 0.5;
                } else {
                    leftArm.rotation.x = 0; rightArm.rotation.x = 0; leftLeg.rotation.x = 0; rightLeg.rotation.x = 0;
                }

                // Proximity Buttons
                let distToCar = playerGroup.position.distanceTo(carGroup.position);
                let distToBoat = playerGroup.position.distanceTo(boatGroup.position);
                if (distToCar < 4.5) { actionBtn.innerText = "Enter Car"; actionBtn.style.display = "block"; }
                else if (distToBoat < 6.0) { actionBtn.innerText = "Enter Boat"; actionBtn.style.display = "block"; }
                else { actionBtn.style.display = "none"; }

                // Camera follow character with Free Fire rotation
                let camX = playerGroup.position.x + Math.sin(cameraAngleY) * 12 * Math.cos(cameraAngleX);
                let camY = playerGroup.position.y + 3 + Math.sin(cameraAngleX) * 10;
                let camZ = playerGroup.position.z + Math.cos(cameraAngleY) * 12 * Math.cos(cameraAngleX);
                camera.position.set(camX, camY, camZ);
                camera.lookAt(playerGroup.position.x, playerGroup.position.y + 1, playerGroup.position.z);

            } else if (vehicleState === 'car') {
                // --- Car Driving Controller ---
                let targetSpeed = moveY * 0.4;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.1;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.05 * Math.sign(vehicleSpeed);
                    carGroup.rotation.y = vehicleRotation;
                }

                let nx = carGroup.position.x + Math.sin(vehicleRotation) * vehicleSpeed;
                let nz = carGroup.position.z + Math.cos(vehicleRotation) * vehicleSpeed;
                if (!checkCollision(nx, nz)) {
                    carGroup.position.x = nx; carGroup.position.z = nz;
                }
                wheels.forEach(w => { w.rotation.x += vehicleSpeed * 2; });

                camera.position.set(carGroup.position.x - Math.sin(vehicleRotation) * 14, carGroup.position.y + 5, carGroup.position.z - Math.cos(vehicleRotation) * 14);
                camera.lookAt(carGroup.position);

            } else if (vehicleState === 'boat') {
                // --- Speed Boat Controller (Water restricted) ---
                let targetSpeed = moveY * 0.35;
                vehicleSpeed += (targetSpeed - vehicleSpeed) * 0.08;

                if (moveX !== 0 && Math.abs(vehicleSpeed) > 0.01) {
                    vehicleRotation -= moveX * 0.04 * Math.sign(vehicleSpeed);
                    boatGroup.rotation.y = vehicleRotation;
                }

                boatGroup.position.x += Math.sin(vehicleRotation) * vehicleSpeed;
                boatGroup.position.z += Math.cos(vehicleRotation) * vehicleSpeed;

                camera.position.set(boatGroup.position.x - Math.sin(vehicleRotation) * 16, boatGroup.position.y + 6, boatGroup.position.z - Math.cos(vehicleRotation) * 16);
                camera.lookAt(boatGroup.position);
            }

            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
