<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONISH Gaming</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .logo-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-img {
            max-width: 320px;
            width: 80vw;
            height: auto;
            opacity: 0;
            transform: scale(0.6);
            animation: epicZoomIn 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.5));
        }

        .loading-bar-container {
            width: 200px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin-top: 35px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease 1s forwards;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: #FFD700;
            box-shadow: 0 0 10px #FFD700;
            animation: loadProgress 1.8s ease-in-out 1s forwards;
        }

        @keyframes epicZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.6);
            }
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes loadProgress {
            to { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Loads your custom logo image -->
        <img src="logo.png" alt="RONISH Gaming Logo" class="logo-img">
        
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>

    <script>
        // Redirects to garage after animation finishes (3.2 seconds)
        setTimeout(() => {
            window.location.href = "garage.html";
        }, 3200);
    </script>

</body>
</html>
