<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RONISH Gaming</title>
    <style>
        body {
            margin: 0;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .logo-container {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Stylish Gaming Font Text */
        .logo-text {
            color: #FFD700;
            font-size: 3.5rem;
            font-weight: 950;
            text-transform: uppercase;
            letter-spacing: 5px;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.8), 
                         0 0 20px rgba(255, 215, 0, 0.5), 
                         0 0 40px rgba(255, 215, 0, 0.3);
            opacity: 0;
            transform: scale(0.5);
            animation: epicZoomIn 1.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .logo-subtext {
            color: #ffffff;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 8px;
            margin-top: 8px;
            opacity: 0;
            animation: fadeIn 1s ease 0.8s forwards;
        }

        .loading-bar-container {
            width: 200px;
            height: 4px;
            background: #222;
            border-radius: 2px;
            margin-top: 35px;
            overflow: hidden;
            opacity: 0;
            animation: fadeIn 0.5s ease 1s forwards;
        }

        .loading-bar {
            width: 0%;
            height: 100%;
            background: #FFD700;
            box-shadow: 0 0 10px #FFD700;
            animation: loadProgress 1.8s ease-in-out 1s forwards;
        }

        @keyframes epicZoomIn {
            0% {
                opacity: 0;
                transform: scale(0.5);
                letter-spacing: 20px;
            }
            100% {
                opacity: 1;
                transform: scale(1);
                letter-spacing: 5px;
            }
        }

        @keyframes fadeIn {
            to { opacity: 1; }
        }

        @keyframes loadProgress {
            to { width: 100%; }
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Stylish Font Text Logo -->
        <div class="logo-text">RONISH Gaming</div>
        <div class="logo-subtext">Extreme Drive</div>
        
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>

    <script>
        // Redirects to garage after animation finishes (3.2 seconds)
        setTimeout(() => {
            window.location.href = "garage.html";
        }, 3200);
    </script>

</body>
</html>
